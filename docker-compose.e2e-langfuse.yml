# =============================================================================
# LANGFUSE E2E TESTING OVERLAY
# =============================================================================
# Docker Compose overlay for Langfuse observability stack in E2E tests.
# Usage: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e-langfuse.yml up
#
# Key Features:
# - Headless initialization (no UI setup needed)
# - CI-specific credentials for automated testing
# - Isolated from development Langfuse instance
# - Ephemeral volumes (cleaned up after tests)
# - Health checks for all services
#
# Credentials:
#   API Keys: pk-lf-ci-e2e-test / sk-lf-ci-e2e-test-secret
#   UI Login: ci@skillforge.dev / ci-test-password-2025
# =============================================================================

name: skillforge

services:
  # =============================================================================
  # LANGFUSE DATABASE LAYER
  # =============================================================================

  langfuse-db-e2e:
    image: postgres:16-alpine
    container_name: skillforge-langfuse-db-e2e
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse-e2e-test
    volumes:
      - langfuse-postgres-e2e-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default

  langfuse-clickhouse-e2e:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: skillforge-langfuse-clickhouse-e2e
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-e2e-test
    volumes:
      - langfuse-clickhouse-e2e-data:/var/lib/clickhouse
      - langfuse-clickhouse-e2e-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - default

  langfuse-redis-e2e:
    image: redis:7-alpine
    container_name: skillforge-langfuse-redis-e2e
    command: redis-server --requirepass redis-e2e-test
    volumes:
      - langfuse-redis-e2e-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-e2e-test", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  # =============================================================================
  # LANGFUSE STORAGE LAYER (MinIO S3-Compatible)
  # =============================================================================

  langfuse-minio-e2e:
    image: minio/minio:latest
    container_name: skillforge-langfuse-minio-e2e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-e2e-access
      MINIO_ROOT_PASSWORD: minio-e2e-secret-key
    volumes:
      - langfuse-minio-e2e-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  langfuse-minio-setup-e2e:
    image: minio/mc:latest
    container_name: skillforge-langfuse-minio-setup-e2e
    depends_on:
      langfuse-minio-e2e:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://langfuse-minio-e2e:9000 minio-e2e-access minio-e2e-secret-key &&
      mc mb minio/langfuse --ignore-existing
      "
    networks:
      - default

  # =============================================================================
  # LANGFUSE APPLICATION LAYER
  # =============================================================================

  langfuse-web-e2e:
    image: langfuse/langfuse:3
    container_name: skillforge-langfuse-web-e2e
    environment:
      # Database connections
      DATABASE_URL: postgresql://langfuse:langfuse-e2e-test@langfuse-db-e2e:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse-e2e:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://default:clickhouse-e2e-test@langfuse-clickhouse-e2e:9000/langfuse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-e2e-test
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis configuration
      REDIS_HOST: langfuse-redis-e2e
      REDIS_PORT: "6379"
      REDIS_AUTH: redis-e2e-test

      # S3/MinIO for blob storage
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio-e2e-access
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio-e2e-secret-key
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio-e2e:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      # Security (E2E test values)
      NEXTAUTH_SECRET: e2e-test-nextauth-secret-32-chars-min
      SALT: e2e-test-salt-minimum-32-characters-required
      ENCRYPTION_KEY: e2e0123456789abcdef0123456789abcdef0123456789abcdef0123456789abc
      NEXTAUTH_URL: http://langfuse-web-e2e:3000

      # Headless initialization for CI/E2E tests
      # Creates organization, project, user, and API keys automatically
      LANGFUSE_INIT_ORG_ID: skillforge-e2e-org
      LANGFUSE_INIT_ORG_NAME: SkillForge E2E Testing
      LANGFUSE_INIT_PROJECT_ID: skillforge-e2e
      LANGFUSE_INIT_PROJECT_NAME: SkillForge E2E Test Project
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-ci-e2e-test
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-ci-e2e-test-secret
      LANGFUSE_INIT_USER_EMAIL: ci@skillforge.dev
      LANGFUSE_INIT_USER_PASSWORD: ci-test-password-2025

      # Performance tuning for E2E tests
      NODE_ENV: production
      LOG_LEVEL: warn  # Reduce log noise in tests

    depends_on:
      langfuse-db-e2e:
        condition: service_healthy
      langfuse-clickhouse-e2e:
        condition: service_healthy
      langfuse-redis-e2e:
        condition: service_healthy
      langfuse-minio-e2e:
        condition: service_healthy
      langfuse-minio-setup-e2e:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --timeout=5 http://langfuse-web-e2e:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s  # Langfuse needs time for DB migrations
    ports:
      - "3000:3000"  # Expose for Playwright E2E tests
    networks:
      - default

  langfuse-worker-e2e:
    image: langfuse/langfuse-worker:3
    container_name: skillforge-langfuse-worker-e2e
    environment:
      # Database connections
      DATABASE_URL: postgresql://langfuse:langfuse-e2e-test@langfuse-db-e2e:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse-e2e:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://default:clickhouse-e2e-test@langfuse-clickhouse-e2e:9000/langfuse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-e2e-test
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis configuration (worker uses individual vars)
      REDIS_HOST: langfuse-redis-e2e
      REDIS_PORT: "6379"
      REDIS_AUTH: redis-e2e-test

      # S3/MinIO configuration
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio-e2e-access
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio-e2e-secret-key
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio-e2e:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      # Security (must match web service)
      SALT: e2e-test-salt-minimum-32-characters-required
      ENCRYPTION_KEY: e2e0123456789abcdef0123456789abcdef0123456789abcdef0123456789abc

      # Performance tuning
      NODE_ENV: production
      LOG_LEVEL: warn

    depends_on:
      langfuse-web-e2e:
        condition: service_healthy
    networks:
      - default

  # =============================================================================
  # BACKEND OVERRIDE (Connect to E2E Langfuse)
  # =============================================================================

  backend:
    environment:
      # Override LANGFUSE_HOST to use E2E stack
      LANGFUSE_ENABLED: "true"
      LANGFUSE_HOST: http://langfuse-web-e2e:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-ci-e2e-test
      LANGFUSE_SECRET_KEY: sk-lf-ci-e2e-test-secret
    depends_on:
      langfuse-web-e2e:
        condition: service_healthy

# =============================================================================
# VOLUMES (Ephemeral in CI - No named volumes for easy cleanup)
# =============================================================================

volumes:
  langfuse-postgres-e2e-data:
    name: skillforge-langfuse-postgres-e2e-data
  langfuse-clickhouse-e2e-data:
    name: skillforge-langfuse-clickhouse-e2e-data
  langfuse-clickhouse-e2e-logs:
    name: skillforge-langfuse-clickhouse-e2e-logs
  langfuse-redis-e2e-data:
    name: skillforge-langfuse-redis-e2e-data
  langfuse-minio-e2e-data:
    name: skillforge-langfuse-minio-e2e-data
