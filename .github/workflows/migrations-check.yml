name: Database Migrations Check

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/alembic/versions/**'
      - '.github/workflows/migrations-check.yml'
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reversible:
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids cross-runner cache issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-root

      - name: Check for irreversible migrations
        working-directory: ./backend
        run: |
          # Get list of migration files
          MIGRATIONS=$(find alembic/versions -name "*.py" -type f)
          
          # Check each migration for downgrade() function
          FAILED=false
          for migration in $MIGRATIONS; do
            if ! grep -q "def downgrade" "$migration"; then
              echo "ERROR: Migration $migration is missing downgrade() function"
              FAILED=true
            fi
          done
          
          if [ "$FAILED" = true ]; then
            echo "Found irreversible migrations. All migrations must include a downgrade() function."
            exit 1
          fi
          
          echo "All migrations appear to have downgrade functions"

  test-migrations:
    runs-on: self-hosted

    # NOTE: Docker services removed - self-hosted macOS runners use local PostgreSQL 17
    # Setup: brew install postgresql@17 pgvector && brew services start postgresql@17
    # Database: createdb skillforge_test && psql -d skillforge_test -c "CREATE EXTENSION vector;"

    env:
      DATABASE_URL: postgresql+asyncpg://@localhost:5432/skillforge_test

    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids cross-runner cache issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-root

      - name: Setup database connection
        working-directory: ./backend
        run: |
          # Local PostgreSQL 17 with pgvector on self-hosted runner
          /usr/local/opt/postgresql@17/bin/psql -d skillforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true

      - name: Run migrations up
        working-directory: ./backend
        run: poetry run alembic upgrade head

      - name: Verify schema
        working-directory: ./backend
        run: |
          # Verify migrations were applied
          poetry run alembic current
          poetry run alembic history

      - name: Run migrations down (one step)
        working-directory: ./backend
        run: |
          # Get current revision
          CURRENT=$(poetry run alembic current | grep -oP '(?<=\()\w+(?=\))' | head -1 || echo "")
          if [ -n "$CURRENT" ]; then
            # Get previous revision
            PREV=$(poetry run alembic history | grep -A 1 "$CURRENT" | tail -1 | grep -oP '(?<=\()\w+(?=\))' | head -1 || echo "")
            if [ -n "$PREV" ] && [ "$PREV" != "$CURRENT" ]; then
              echo "Downgrading from $CURRENT to $PREV"
              poetry run alembic downgrade "$PREV"
            fi
          fi

      - name: Run migrations up again
        working-directory: ./backend
        run: poetry run alembic upgrade head

      - name: Cleanup
        if: always()
        working-directory: ./backend
        run: poetry run alembic downgrade base || true
