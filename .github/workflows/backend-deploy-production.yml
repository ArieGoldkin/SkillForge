name: Backend Deploy - Production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy-production.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

permissions:
  contents: read

concurrency:
  group: backend-deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-deployment-checks:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify CI passed
        uses: actions/github-script@v8
        with:
          script: |
            const { data: workflows } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backend-ci.yml',
              branch: 'main',
              status: 'success',
              per_page: 1
            });

            if (workflows.workflow_runs.length === 0 || workflows.workflow_runs[0].conclusion !== 'success') {
              core.setFailed('Backend CI must pass before production deployment');
            }

      - name: Check for unmerged PRs
        uses: actions/github-script@v8
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main'
            });

            if (prs.length > 0) {
              console.log(`Warning: ${prs.length} open PR(s) targeting main`);
              prs.forEach(pr => {
                console.log(`- #${pr.number}: ${pr.title}`);
              });
            }

  deploy:
    runs-on: [self-hosted, macOS, ARM64]
    needs: pre-deployment-checks
    environment:
      name: production
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/skillforge-backend:latest', secrets.DOCKERHUB_USERNAME) || 'skillforge-backend:latest' }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/skillforge-backend:v{1}', secrets.DOCKERHUB_USERNAME, github.run_number) || format('skillforge-backend:v{0}', github.run_number) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        uses: actions/github-script@v8
        with:
          script: |
            const tag = `v${context.run_number}-${context.sha.substring(0, 7)}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Created tag: ${tag}`);

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          # Install Railway CLI
          curl -fsSL https://railway.app/install.sh | sh
          # Deploy using Railway CLI
          railway up --service skillforge-backend-production --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Render
        if: env.RENDER_API_KEY != ''
        uses: johnbeynon/render-deploy-action@v0.0.9
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  migrate:
    runs-on: [self-hosted, macOS, ARM64]
    needs: deploy
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-root

      - name: Backup database
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Database backup should be handled by your database provider"
          echo "For manual backup, run: pg_dump $DATABASE_URL > backup-$(date +%Y%m%d-%H%M%S).sql"

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: poetry run alembic upgrade head

      - name: Verify migrations
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: poetry run alembic current

  health-check:
    runs-on: [self-hosted, macOS, ARM64]
    needs: migrate
    environment:
      name: production
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          PROD_URL="${{ secrets.PRODUCTION_API_URL || 'https://api.skillforge.com' }}"
          echo "Checking health at $PROD_URL/health"
          
          for i in {1..15}; do
            if curl -f "$PROD_URL/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          
          echo "Health check failed after 15 attempts"
          echo "Consider rolling back the deployment"
          exit 1

  smoke-tests:
    runs-on: [self-hosted, macOS, ARM64]
    needs: health-check
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-root

      - name: Run smoke tests
        working-directory: ./backend
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.skillforge.com' }}
        run: |
          # Basic smoke tests
          curl -f "$API_BASE_URL/health" || exit 1
          echo "Production smoke tests passed!"

  notify:
    runs-on: [self-hosted, macOS, ARM64]
    needs: smoke-tests
    if: always()
    environment:
      name: production
    steps:
      - name: Deployment notification
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ needs.smoke-tests.result }}';
            const message = status === 'success' 
              ? `✅ Production deployment successful!\n\nCommit: ${context.sha.substring(0, 7)}\nRun: #${context.runNumber}`
              : `❌ Production deployment failed!\n\nCommit: ${context.sha.substring(0, 7)}\nRun: #${context.runNumber}`;
            
            console.log(message);
