name: LLM Benchmark (Nightly)

on:
  # Nightly run at 2am UTC
  schedule:
    - cron: "0 2 * * *"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      models:
        description: "Models to benchmark (comma-separated)"
        required: false
        default: "gpt-4o-mini,claude-sonnet-4-20250514"
        type: string

permissions:
  pull-requests: read
  contents: read
  actions: read

concurrency:
  group: llm-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run LLM Benchmark
    runs-on: self-hosted
    timeout-minutes: 60

    # NOTE: Docker services removed - self-hosted macOS runners use local PostgreSQL 17
    # Setup: brew install postgresql@17 pgvector && brew services start postgresql@17

    env:
      DATABASE_URL: postgresql+asyncpg://@localhost:5432/skillforge_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-root

      - name: Setup database
        working-directory: backend
        run: |
          # Local PostgreSQL 17 with pgvector on self-hosted runner
          /usr/local/opt/postgresql@17/bin/psql -d skillforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          poetry run alembic upgrade head

      - name: Load fixtures
        working-directory: backend
        env:
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS: "true"
        run: poetry run python scripts/load_expanded_fixtures.py --expanded --replace

      - name: Run LLM Benchmark
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: |
          # Run benchmark for configured models
          poetry run python -c "
          import asyncio
          import json
          from datetime import datetime, UTC
          from app.evaluation.llm_benchmark import LLMBenchmark

          async def main():
              benchmark = LLMBenchmark()
              models = '${{ inputs.models || 'gpt-4o-mini' }}'.split(',')

              results = {}
              for model in models:
                  model = model.strip()
                  print(f'Benchmarking {model}...')
                  result = await benchmark.run_experiment(
                      task_type='supervisor',
                      model_id=model,
                      dataset_name='supervisor_evaluation',
                      experiment_prefix=f'nightly-{datetime.now(UTC).strftime(\"%Y%m%d\")}',
                  )
                  results[model] = result.to_dict() if hasattr(result, 'to_dict') else str(result)

              # Save results
              with open('benchmark_results.json', 'w') as f:
                  json.dump(results, f, indent=2, default=str)

              print('Benchmark complete!')

          asyncio.run(main())
          " || echo "Benchmark completed with warnings"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: llm-benchmark-results-${{ github.run_number }}
          path: backend/benchmark_results.json
          compression-level: 9
          retention-days: 90
          if-no-files-found: warn
