name: Evaluation Pipeline

on:
  pull_request:
    branches: [main, dev]
    paths:
      # Run on changes to agent code (moved to domains/*/workflows/agents/)
      - "backend/app/domains/**/workflows/agents/**"
      - "backend/app/domains/**/workflows/**"
      - "backend/app/shared/services/**"
      # Run on changes to evaluation infrastructure
      - "backend/app/evaluation/**"
      - "backend/tests/smoke/retrieval/**"
      # Run on changes to this workflow
      - ".github/workflows/evaluation.yml"

  # Weekly scheduled run on main (Monday 6am UTC)
  schedule:
    - cron: "0 6 * * 1"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      fail_on_warn:
        description: "Fail on warnings"
        required: false
        default: false
        type: boolean

permissions:
  pull-requests: write
  contents: read
  actions: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: self-hosted
    outputs:
      evaluation: ${{ steps.filter.outputs.evaluation }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            evaluation:
              - "backend/app/domains/**/workflows/agents/**"
              - "backend/app/domains/**/workflows/**"
              - "backend/app/shared/services/**"
              - "backend/app/evaluation/**"
              - "backend/tests/smoke/retrieval/**"
              - ".github/workflows/evaluation.yml"

  evaluate:
    name: Run Evaluation Pipeline
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.evaluation == 'true'
    runs-on: self-hosted
    timeout-minutes: 30

    # Self-hosted macOS runners provide: PostgreSQL 18, Ollama, Langfuse (Docker)

    env:
      DATABASE_URL: postgresql+asyncpg://@localhost:5432/skillforge_test
      # Langfuse observability for evaluation traces (Issue #602)
      # Only enable if secrets are configured (graceful fallback for forks/missing secrets)
      LANGFUSE_ENABLED: ${{ secrets.LANGFUSE_PUBLIC_KEY != '' && 'true' || 'false' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      # Ollama local models for 93% CI cost reduction (Issue #606)
      OLLAMA_ENABLED: "true"
      OLLAMA_HOST: "http://localhost:11434"
      OLLAMA_MODEL_REASONING: "deepseek-r1:70b"
      OLLAMA_MODEL_CODING: "qwen2.5-coder:32b"
      OLLAMA_MODEL_EMBED: "nomic-embed-text"

    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids cross-runner cache issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for baseline comparison

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.name }}-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.name }}-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: backend
        run: |
          # Force fresh venv if cache is corrupted (check alembic, since that's what this job uses)
          if [ -d ".venv" ] && ! poetry run python -m alembic --version >/dev/null 2>&1; then
            echo "⚠️ Cached venv appears corrupted (alembic not found), removing..."
            rm -rf .venv 2>/dev/null || true
          fi
          poetry install --no-interaction --no-root

      - name: Ensure Langfuse running
        run: |
          if ! curl -sf http://localhost:3000/api/public/health > /dev/null 2>&1; then
            echo "Starting Langfuse stack..."
            cd ${{ github.workspace }} && docker compose up -d langfuse-web langfuse-worker langfuse-db langfuse-clickhouse langfuse-redis langfuse-minio langfuse-minio-setup
            echo "Waiting for Langfuse to be healthy..."
            for i in {1..30}; do
              if curl -sf http://localhost:3000/api/public/health > /dev/null 2>&1; then
                echo "Langfuse is ready"
                break
              fi
              sleep 2
            done
          else
            echo "Langfuse already running"
          fi

      - name: Setup database
        working-directory: backend
        run: |
          # PostgreSQL 18 with pgvector on self-hosted runner
          /opt/homebrew/opt/postgresql@18/bin/psql -d skillforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          poetry run python -m alembic upgrade head

      - name: Ensure Ollama models ready
        run: |
          # Check Ollama is running
          if ! curl -s http://localhost:11434/api/tags > /dev/null; then
            echo "Starting Ollama service..."
            ollama serve &
            sleep 5
          fi

          # Ensure required models are available (pull if missing)
          echo "Checking Ollama models..."
          ollama list

          # Pre-warm embedding model for faster first call
          echo "Pre-warming embedding model..."
          curl -s http://localhost:11434/api/embeddings -d '{"model":"nomic-embed-text","prompt":"warmup"}' > /dev/null || true

      - name: Load evaluation fixtures
        working-directory: backend
        env:
          # Use Ollama embeddings instead of deterministic (Issue #606)
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS: "false"
        run: |
          # Load fixture data with Ollama embeddings for evaluation
          poetry run python scripts/load_expanded_fixtures.py --expanded --replace

      - name: Run evaluation pipeline
        id: evaluation
        continue-on-error: true  # Don't fail PR on evaluation results - report metrics only
        working-directory: backend
        env:
          # Use Ollama local models for evaluation (Issue #606)
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS: "false"
        run: |
          # Run evaluation with local Ollama models (93% cost savings)
          poetry run python scripts/run_evaluation.py \
            --expanded \
            --output evaluation_results.json \
            ${{ inputs.fail_on_warn && '--fail-on-warn' || '' }}

      - name: Generate markdown report
        if: always()
        working-directory: backend
        run: |
          # Generate markdown report from JSON results
          poetry run python -c "
          import json
          from pathlib import Path
          from app.evaluation.pipeline.runner import PipelineResult

          with open('evaluation_results.json') as f:
              data = json.load(f)

          # Reconstruct PipelineResult for markdown generation
          # This is a simplified version - real implementation would deserialize properly
          print('# Evaluation Results')
          print()
          print(f\"**Status**: {data['overall_status']}\")
          print(f\"**Examples**: {data['total_passed']}/{data['total_examples']}\")
          print(f\"**Time**: {data['execution_time_seconds']:.1f}s\")
          " > evaluation_report.md

          # Append regression report if it exists
          if [ -f evaluation_results_regression.md ]; then
            echo "" >> evaluation_report.md
            cat evaluation_results_regression.md >> evaluation_report.md
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        continue-on-error: true  # Don't fail if permissions prevent commenting
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/evaluation_report.md', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('# Evaluation')
            );

            const commentBody = `${report}\n\n---\n*Automated evaluation from [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evaluation-results
          path: |
            backend/evaluation_results.json
            backend/evaluation_report.md
            backend/evaluation_results_regression.md
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn

      - name: Check evaluation status
        if: always()
        continue-on-error: true  # Report status without blocking PR
        working-directory: backend
        run: |
          # Report evaluation status (non-blocking)
          STATUS=$(jq -r '.overall_status' evaluation_results.json 2>/dev/null || echo "unknown")
          PASSED=$(jq -r '.total_passed' evaluation_results.json 2>/dev/null || echo "?")
          TOTAL=$(jq -r '.total_examples' evaluation_results.json 2>/dev/null || echo "?")

          echo "## Evaluation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed**: $PASSED / $TOTAL" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" = "fail" ]; then
            echo "::warning::Evaluation completed with failures - see PR comment for details"
          elif [ "$STATUS" = "warn" ]; then
            echo "::warning::Evaluation completed with warnings - see PR comment for details"
          else
            echo "::notice::Evaluation passed"
          fi
