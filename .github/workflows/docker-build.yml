# =============================================================================
# Docker Image Build & Push Workflow
# =============================================================================
# Builds and caches Docker images to GitHub Container Registry (ghcr.io)
# for faster E2E tests. Images are built on:
# - Push to main/dev (always rebuild)
# - PR with backend/frontend changes (build and cache)
#
# E2E tests can then pull pre-built images instead of building from scratch,
# saving ~15 minutes per run.
# =============================================================================

name: Docker Build

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile*'

# GLOBAL Docker mutex: Prevents Buildx conflicts across ALL Docker-heavy workflows
# Uses shared group name "docker-mutex-*" that E2E Tests also uses
# This ensures Docker Build and E2E Tests never run Docker simultaneously on same branch
concurrency:
  group: docker-mutex-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false  # Don't cancel - let builds complete

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  # Note: DOCKER_API_VERSION removed - let Docker auto-negotiate
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: self-hosted
    # This workflow is optional - don't block PRs if it fails
    continue-on-error: true
    timeout-minutes: 15  # Allow time for retries
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker readiness (exponential backoff)
        run: |
          # Docker Desktop on macOS can be flaky - use exponential backoff
          MAX_RETRIES=12
          RETRY=0
          DELAY=2
          MAX_DELAY=30

          while [ $RETRY -lt $MAX_RETRIES ]; do
            # Test both 'docker info' and 'docker ps' - some failures only show in one
            if docker info >/dev/null 2>&1 && docker ps >/dev/null 2>&1; then
              echo "✓ Docker daemon ready after $RETRY retries"
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "Docker not ready, waiting ${DELAY}s... (attempt $RETRY/$MAX_RETRIES)"
            sleep $DELAY

            # Exponential backoff with cap
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt $MAX_DELAY ]; then
              DELAY=$MAX_DELAY
            fi
          done
          echo "::error::Docker daemon not ready after $MAX_RETRIES attempts"
          docker info 2>&1 || true
          exit 1

      - name: Cleanup stale Buildx builders
        run: |
          # Remove all non-default builders to prevent conflicts
          for builder in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep -v '^default$' | grep -v '^desktop-linux$' || true); do
            echo "Removing stale builder: $builder"
            docker buildx rm "$builder" --force 2>/dev/null || true
          done
          docker buildx use default 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Output image info
        run: |
          echo "## Backend Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  build-frontend:
    runs-on: self-hosted
    # Serialize after build-backend to prevent Buildx container conflicts
    needs: [build-backend]
    # This workflow is optional - don't block PRs if it fails
    continue-on-error: true
    timeout-minutes: 15  # Allow time for retries
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker readiness (exponential backoff)
        run: |
          # Docker Desktop on macOS can be flaky - use exponential backoff
          MAX_RETRIES=12
          RETRY=0
          DELAY=2
          MAX_DELAY=30

          while [ $RETRY -lt $MAX_RETRIES ]; do
            # Test both 'docker info' and 'docker ps' - some failures only show in one
            if docker info >/dev/null 2>&1 && docker ps >/dev/null 2>&1; then
              echo "✓ Docker daemon ready after $RETRY retries"
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "Docker not ready, waiting ${DELAY}s... (attempt $RETRY/$MAX_RETRIES)"
            sleep $DELAY

            # Exponential backoff with cap
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt $MAX_DELAY ]; then
              DELAY=$MAX_DELAY
            fi
          done
          echo "::error::Docker daemon not ready after $MAX_RETRIES attempts"
          docker info 2>&1 || true
          exit 1

      - name: Cleanup stale Buildx builders
        run: |
          # Remove all non-default builders to prevent conflicts
          for builder in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep -v '^default$' | grep -v '^desktop-linux$' || true); do
            echo "Removing stale builder: $builder"
            docker buildx rm "$builder" --force 2>/dev/null || true
          done
          docker buildx use default 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: development
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "## Frontend Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
