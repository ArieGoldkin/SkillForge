name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Phase 1: FAST GATES (30-60 sec) - Fail fast on code quality issues
  # ============================================================================
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Check Biome formatting
        working-directory: ./frontend
        run: npm run format:check

  type-check:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript check
        working-directory: ./frontend
        run: npm run typecheck

  # ============================================================================
  # Phase 2: UNIT TESTS (1-2 min) - Only run if lint/type pass
  # ============================================================================
  test:
    needs: [lint, type-check]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-test-reports
          path: frontend/coverage/
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # Phase 3: BUILD (1-2 min) - Only run if tests pass
  # ============================================================================
  build:
    needs: [test]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Check bundle sizes
        working-directory: ./frontend
        run: npm run build:check-size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: frontend/dist
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # Phase 4: VISUAL REGRESSION (Playwright Native) - Only run on PRs to main
  # ============================================================================
  visual-regression:
    needs: [build]
    runs-on: self-hosted
    # Only run visual regression on PRs to main to reduce CI load
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH
        run: |
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps

      - name: Start test environment
        working-directory: ./frontend
        run: npm run test:env:up

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:5174 > /dev/null 2>&1; do sleep 2; done' || true
          timeout 60 bash -c 'until curl -f http://localhost:8501/health > /dev/null 2>&1; do sleep 2; done' || true

      - name: Run visual regression tests
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          API_BASE_URL: http://localhost:8501
        run: npm run e2e:vrt

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report/
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-diffs
          path: frontend/e2e/__screenshots__/
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn

      - name: Stop test environment
        if: always()
        working-directory: ./frontend
        run: npm run test:env:down
