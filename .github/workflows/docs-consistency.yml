name: docs-consistency

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  docs-consistency:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run docs consistency checks
        run: bash scripts/check_docs_consistency.sh


