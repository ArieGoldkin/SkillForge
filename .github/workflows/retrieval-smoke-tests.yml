name: Retrieval Smoke Tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/app/shared/services/chunking/**'
      - 'backend/app/shared/services/retrieval/**'
      - 'backend/app/shared/services/embeddings/**'
      - 'backend/app/shared/services/search/**'
      - 'backend/tests/smoke/retrieval/**'
      - '.github/workflows/retrieval-smoke-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'backend/app/shared/services/chunking/**'
      - 'backend/app/shared/services/retrieval/**'
      - 'backend/app/shared/services/embeddings/**'
      - 'backend/app/shared/services/search/**'
      - 'backend/tests/smoke/retrieval/**'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: retrieval-smoke-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: self-hosted
    timeout-minutes: 10

    # NOTE: Docker services removed - self-hosted macOS runners use local PostgreSQL 17
    # Setup: brew install postgresql@17 pgvector && brew services start postgresql@17
    # Database: createdb skillforge_test && psql -d skillforge_test -c "CREATE EXTENSION vector;"

    env:
      # Local PostgreSQL uses current user (no password) on macOS
      DATABASE_URL: postgresql+asyncpg://@localhost:5432/skillforge_test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: poetry install --no-interaction --no-root

      - name: Ensure pgvector extension
        run: |
          # Local PostgreSQL 17 with pgvector pre-installed on self-hosted runner
          /usr/local/opt/postgresql@17/bin/psql -d skillforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true

      - name: Run Alembic migrations
        working-directory: ./backend
        run: poetry run alembic upgrade head

      # ========================================================================
      # Run ALL smoke tests in ONE pytest command (optimized from 4 separate runs)
      # ========================================================================
      - name: Run retrieval smoke tests
        working-directory: ./backend
        run: |
          poetry run pytest tests/smoke/retrieval/ \
            -m "smoke and retrieval" \
            -v \
            --tb=short \
            --maxfail=5 \
            --timeout=120 \
            --durations=10 \
            --junitxml=test-results/smoke-tests.xml

      - name: Generate test summary
        if: always()
        run: |
          echo "## Retrieval Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Semantic | Vector similarity search |" >> $GITHUB_STEP_SUMMARY
          echo "| Keyword | PostgreSQL tsvector FTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Hybrid | RRF fusion ranking |" >> $GITHUB_STEP_SUMMARY
          echo "| Coarse-to-Fine | Hierarchical retrieval |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Metrics:** Recall@5, MRR, NDCG@5" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-test-results
          path: backend/test-results/
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn

      - name: Comment PR with results
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${emoji} Retrieval Smoke Tests

            **Status:** ${status}
            **Commit:** \`${{ github.sha }}\`

            | Category | Description |
            |----------|-------------|
            | Semantic | Vector similarity |
            | Keyword | Full-text search |
            | Hybrid | RRF combination |
            | Coarse-to-Fine | Hierarchical |

            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });
