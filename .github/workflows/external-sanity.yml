name: External Sanity

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/app/shared/services/**"
      - "backend/app/domains/**/workflows/**"
      - "backend/app/api/**"
      - "backend/scripts/**"
      - ".github/workflows/external-sanity.yml"
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: external-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openai-embedding-sanity:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-v2-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v2-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction --no-root

      - name: Run external sanity test (capped)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-unit-tests' }}
        run: |
          poetry run pytest tests/external_sanity/test_openai_embedding.py -m external -q --maxfail=1 --timeout=60


