name: External Sanity

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/app/shared/services/**"
      - "backend/app/domains/**/workflows/**"
      - "backend/app/api/**"
      - "backend/scripts/**"
      - ".github/workflows/external-sanity.yml"
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: external-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openai-embedding-sanity:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          cd backend && poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          # v6: Better corruption detection (check pytest, not just python)
          key: poetry-v6-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v6-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: backend
        run: |
          # Force fresh venv if cache is corrupted
          # Check pytest specifically since that's what fails on corrupted caches
          if [ -d ".venv" ]; then
            if ! poetry run pytest --version >/dev/null 2>&1; then
              echo "⚠️ Cached venv appears corrupted (pytest not found), removing..."
              rm -rf .venv 2>/dev/null || true
            else
              echo "✓ Cached venv appears healthy"
            fi
          fi
          poetry install --no-interaction --no-root

      - name: Verify pytest installation
        working-directory: backend
        run: |
          echo "Verifying pytest is accessible..."
          poetry run pytest --version
          echo "✓ pytest found"

      - name: Run external sanity test (capped)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-unit-tests' }}
        run: |
          poetry run pytest tests/external_sanity/test_openai_embedding.py -m external -q --maxfail=1 --timeout=60


