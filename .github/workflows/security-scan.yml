name: Security Scan

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-security:
    runs-on: ubuntu-24.04
    needs: changes
    # Run on schedule/manual, or if backend files changed on push
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install poetry-plugin-export
        run: poetry self add poetry-plugin-export

      - name: Export dependencies
        working-directory: ./backend
        continue-on-error: true
        run: |
          poetry export -f requirements.txt --output requirements.txt --without-hashes

      - name: Run pip-audit
        working-directory: ./backend
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --desc --format=json --output=backend-security-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-security-report
          path: backend/backend-security-report.json
          retention-days: 30

      - name: Check for critical/high vulnerabilities
        working-directory: ./backend
        run: |
          pip-audit --requirement requirements.txt --desc --only-vuln || exit 0
          if [ $? -eq 0 ]; then
            echo "No vulnerabilities found"
          else
            echo "Critical or high vulnerabilities detected!"
            exit 1
          fi

  frontend-security:
    runs-on: ubuntu-24.04
    needs: changes
    # Run on schedule/manual, or if frontend files changed on push
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        continue-on-error: true
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        continue-on-error: true
        run: |
          npm audit --json > frontend-security-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-security-report
          path: frontend/frontend-security-report.json
          retention-days: 30

      - name: Check for critical/high vulnerabilities
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate || exit 0
          if [ $? -eq 0 ]; then
            echo "No vulnerabilities found"
          else
            echo "Critical or high vulnerabilities detected!"
            exit 1
          fi

  dependabot-alerts:
    runs-on: ubuntu-24.04
    needs: changes
    # Run on schedule/manual only (Dependabot alerts are repo-wide, not path-specific)
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Dependabot alerts
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const alerts = await github.rest.dependabot.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });

              const criticalHigh = alerts.data.filter(
                alert => alert.security_advisory.severity === 'critical' || 
                        alert.security_advisory.severity === 'high'
              );

              if (criticalHigh.length > 0) {
                console.log(`Found ${criticalHigh.length} critical/high alerts:`);
                criticalHigh.forEach(alert => {
                  console.log(`- ${alert.security_advisory.ghsa_id}: ${alert.security_advisory.summary}`);
                });
                core.setFailed(`Found ${criticalHigh.length} critical/high security alerts`);
              } else {
                console.log('No critical/high security alerts found');
              }
            } catch (error) {
              if (error.status === 403 && error.message.includes('Dependabot alerts are disabled')) {
                console.log('⚠️  Dependabot alerts are disabled for this repository.');
                console.log('   To enable: Go to repository Settings > Security > Code security and analysis > Enable Dependabot alerts');
                console.log('   Skipping Dependabot alert check.');
              } else {
                console.error('Error checking Dependabot alerts:', error.message);
                core.setFailed(`Failed to check Dependabot alerts: ${error.message}`);
              }
            }

  security-report:
    runs-on: ubuntu-24.04
    needs: [changes, backend-security, frontend-security, dependabot-alerts]
    # Always run to generate report (handles skipped jobs gracefully)
    if: always()
    steps:
      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate security summary
        run: |
          echo "# Security Scan Report" > security-summary.md
          echo "Date: $(date -u +%Y-%m-%d)" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Backend Security" >> security-summary.md
          if [ -f security-reports/backend-security-report/backend-security-report.json ]; then
            cat security-reports/backend-security-report/backend-security-report.json >> security-summary.md
          else
            echo "No backend security report available" >> security-summary.md
          fi
          echo "" >> security-summary.md
          echo "## Frontend Security" >> security-summary.md
          if [ -f security-reports/frontend-security-report/frontend-security-report.json ]; then
            cat security-reports/frontend-security-report/frontend-security-report.json >> security-summary.md
          else
            echo "No frontend security report available" >> security-summary.md
          fi

      - name: Upload security summary
        uses: actions/upload-artifact@v6
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 30
