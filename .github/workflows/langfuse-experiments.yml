name: Langfuse Experiments

# Issue #570: Unified Langfuse experiment runner with real G-Eval
# Runs quality experiments using run_dataset_experiments.py (3-mode architecture)
# Mode: quality (LLM-as-judge via real G-Eval)

on:
  # Run on changes to backend code that affect model quality
  push:
    branches: [main]
    paths:
      - "backend/app/domains/**/workflows/agents/**"
      - "backend/app/domains/**/workflows/**"
      - "backend/app/shared/services/**"
      - "backend/app/shared/services/g_eval/**"
      - ".github/workflows/langfuse-experiments.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend/app/domains/**/workflows/agents/**"
      - "backend/app/domains/**/workflows/**"
      - "backend/app/shared/services/**"
      - "backend/app/shared/services/g_eval/**"
      - ".github/workflows/langfuse-experiments.yml"

  # Manual trigger with configurable options
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to evaluate (all, golden_analyses, synthesis, etc.)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - supervisor
          - agent_analysis
          - synthesis
          - golden_analyses
          - adversarial
          - edge_cases
      mode:
        description: "Evaluation mode"
        required: false
        default: "quality"
        type: choice
        options:
          - validate
          - quality
      fail_on_threshold:
        description: "Fail if score < threshold (e.g., 0.6)"
        required: false
        type: string

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: langfuse-experiments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-experiments:
    name: Run Langfuse Experiments
    runs-on: self-hosted
    timeout-minutes: 30

    # NOTE: Docker services removed - self-hosted macOS runners use local PostgreSQL 17

    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids cross-runner cache issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.name }}-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.name }}-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: backend
        run: |
          # Force fresh venv if cache is corrupted
          if [ -d ".venv" ] && ! poetry run python -c "import langfuse" >/dev/null 2>&1; then
            echo "⚠️ Cached venv appears corrupted (langfuse not found), removing..."
            rm -rf .venv 2>/dev/null || true
          fi
          poetry install --no-interaction --no-root

      - name: Run G-Eval experiments
        id: run-experiments
        continue-on-error: true
        working-directory: backend
        env:
          # Langfuse configuration
          LANGFUSE_ENABLED: "true"
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          # Cloud LLM for G-Eval (Issue #570: real LLM-as-judge)
          OLLAMA_ENABLED: "false"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Git metadata for experiment context
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Run unified dataset experiments with real G-Eval
          DATASET="${{ inputs.dataset || 'all' }}"
          MODE="${{ inputs.mode || 'quality' }}"

          if [ "$DATASET" = "all" ]; then
            # Run all datasets sequentially
            for ds in supervisor agent_analysis synthesis golden_analyses adversarial edge_cases; do
              echo "=========================================="
              echo "Running $ds dataset with mode: $MODE"
              echo "=========================================="
              poetry run python scripts/run_dataset_experiments.py \
                --dataset "$ds" \
                --mode "$MODE" \
                2>&1 | tee -a experiment_output.log
            done
          else
            # Run single dataset
            poetry run python scripts/run_dataset_experiments.py \
              --dataset "$DATASET" \
              --mode "$MODE" \
              2>&1 | tee experiment_output.log
          fi

      - name: Parse experiment results
        id: parse-results
        if: always()
        working-directory: backend
        run: |
          # Parse baseline scores from all datasets
          ALL_PASS="true"
          TOTAL_ITEMS=0
          AVG_SCORES=""

          for baseline in scripts/baseline_scores/*_baseline.json; do
            if [ -f "$baseline" ]; then
              DATASET=$(jq -r '.dataset // "unknown"' "$baseline")
              STATUS=$(jq -r '.ci_status // "UNKNOWN"' "$baseline")
              ITEMS=$(jq -r '.items_evaluated // 0' "$baseline")
              SCORE=$(jq -r '.metrics.avg_score // 0' "$baseline")
              PASS_RATE=$(jq -r '.metrics.pass_rate // 0' "$baseline")

              TOTAL_ITEMS=$((TOTAL_ITEMS + ITEMS))
              AVG_SCORES="${AVG_SCORES}${DATASET}: ${SCORE} (pass_rate: ${PASS_RATE})\n"

              if [ "$STATUS" != "PASS" ]; then
                ALL_PASS="false"
              fi
            fi
          done

          if [ "$ALL_PASS" = "true" ]; then
            echo "ci_status=PASS" >> $GITHUB_OUTPUT
          else
            echo "ci_status=FAIL" >> $GITHUB_OUTPUT
          fi

          echo "total_items=$TOTAL_ITEMS" >> $GITHUB_OUTPUT
          echo "scores<<EOF" >> $GITHUB_OUTPUT
          echo -e "$AVG_SCORES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check quality threshold
        if: always() && inputs.fail_on_threshold != ''
        working-directory: backend
        run: |
          THRESHOLD="${{ inputs.fail_on_threshold }}"
          CI_STATUS="${{ steps.parse-results.outputs.ci_status }}"

          echo "CI Status: $CI_STATUS"
          echo "Threshold: $THRESHOLD"

          # Check each baseline file against threshold
          for baseline in scripts/baseline_scores/*_baseline.json; do
            if [ -f "$baseline" ]; then
              SCORE=$(jq -r '.metrics.avg_score // 0' "$baseline")
              DATASET=$(jq -r '.dataset // "unknown"' "$baseline")

              if [ $(echo "$SCORE < $THRESHOLD" | bc -l) -eq 1 ]; then
                echo "::error::Dataset $DATASET score ($SCORE) below threshold ($THRESHOLD)"
                exit 1
              fi
            fi
          done

          echo "::notice::All datasets meet quality threshold ($THRESHOLD)"

      - name: Generate experiment report
        if: always()
        working-directory: backend
        run: |
          # Create markdown report from baseline scores
          cat > experiment_report.md << 'HEADER'
          # G-Eval Experiment Results

          **Mode**: `${{ inputs.mode || 'quality' }}`
          **Dataset**: `${{ inputs.dataset || 'all' }}`
          **Commit**: `${{ github.sha }}`
          **Branch**: `${{ github.head_ref || github.ref_name }}`
          **CI Status**: `${{ steps.parse-results.outputs.ci_status }}`

          ## Dataset Scores

          | Dataset | Items | Avg Score | Pass Rate | Status |
          |---------|-------|-----------|-----------|--------|
          HEADER

          # Add each dataset row
          for baseline in scripts/baseline_scores/*_baseline.json; do
            if [ -f "$baseline" ]; then
              DATASET=$(jq -r '.dataset // "unknown"' "$baseline")
              ITEMS=$(jq -r '.items_evaluated // 0' "$baseline")
              SCORE=$(jq -r '.metrics.avg_score // 0' "$baseline")
              PASS_RATE=$(jq -r '.metrics.pass_rate // 0' "$baseline")
              STATUS=$(jq -r '.ci_status // "UNKNOWN"' "$baseline")

              echo "| $DATASET | $ITEMS | $SCORE | $PASS_RATE | $STATUS |" >> experiment_report.md
            fi
          done

          cat >> experiment_report.md << 'FOOTER'

          ## View in Langfuse

          [View Experiment Results →](${{ secrets.LANGFUSE_HOST }})

          ---

          <details>
          <summary>Execution Log (last 50 lines)</summary>

          ```
          FOOTER

          tail -50 experiment_output.log 2>/dev/null >> experiment_report.md || echo "No log file available" >> experiment_report.md

          echo '```' >> experiment_report.md
          echo '</details>' >> experiment_report.md

      - name: Add summary to GitHub Actions
        if: always()
        run: |
          cat backend/experiment_report.md >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/experiment_report.md', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('# G-Eval Experiment')
            );

            const commentBody = `${report}\n\n---\n*Automated from [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: g-eval-experiment-results-${{ github.run_number }}
          path: |
            backend/scripts/baseline_scores/*.json
            backend/experiment_report.md
            backend/experiment_output.log
          compression-level: 9
          retention-days: 30
          if-no-files-found: warn

      - name: Report final status
        if: always()
        run: |
          CI_STATUS="${{ steps.parse-results.outputs.ci_status }}"

          if [ "$CI_STATUS" = "PASS" ]; then
            echo "::notice::G-Eval experiments completed - all datasets passed"
            exit 0
          else
            echo "::warning::G-Eval experiments completed with failures - check dataset scores"
            # Don't fail the workflow, just warn (experiments are informational)
            exit 0
          fi
