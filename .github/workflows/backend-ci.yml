name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    # NOTE: Removed paths filter for pull_request due to GitHub Actions bug
    # where large PRs silently skip path-filtered workflows. Using dorny/paths-filter
    # in the 'changes' job instead for reliable path detection.
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Phase 0: Detect changes (workaround for GitHub Actions paths filter bug)
  # ============================================================================
  changes:
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  # ============================================================================
  # Phase 1: FAST GATES (30-60 sec) - Fail fast on code quality issues
  # ============================================================================
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids macOS .DS_Store lock issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          # Include runner.name to prevent cross-runner cache corruption (Issue #638)
          key: poetry-v7-${{ runner.name }}-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v7-${{ runner.name }}-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Force fresh venv if cache is corrupted or from different runner
          # Check: 1) ruff exists, 2) python path matches current directory
          if [ -d ".venv" ]; then
            VENV_PYTHON=$(cat .venv/pyvenv.cfg 2>/dev/null | grep "^home" | cut -d= -f2 | tr -d ' ')
            if ! poetry run ruff --version >/dev/null 2>&1 || [ -z "$VENV_PYTHON" ]; then
              echo "⚠️ Cached venv appears corrupted, removing..."
              rm -rf .venv 2>/dev/null || true
            fi
          fi
          poetry install --no-interaction --no-root

      - name: Run ruff linting
        working-directory: ./backend
        run: poetry run ruff check app/

      - name: Check ruff formatting
        working-directory: ./backend
        run: poetry run ruff format --check app/

  type-check:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids macOS .DS_Store lock issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          # Include runner.name to prevent cross-runner cache corruption (Issue #638)
          key: poetry-v7-${{ runner.name }}-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v7-${{ runner.name }}-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Force fresh venv if cache is corrupted or from different runner
          if [ -d ".venv" ]; then
            VENV_PYTHON=$(cat .venv/pyvenv.cfg 2>/dev/null | grep "^home" | cut -d= -f2 | tr -d ' ')
            if ! poetry run ty --version >/dev/null 2>&1 || [ -z "$VENV_PYTHON" ]; then
              echo "⚠️ Cached venv appears corrupted, removing..."
              rm -rf .venv 2>/dev/null || true
            fi
          fi
          poetry install --no-interaction --no-root

      - name: Run ty type check
        working-directory: ./backend
        run: poetry run ty check app/

  # ============================================================================
  # Phase 2: UNIT TESTS (2-3 min) - Only run if lint/type pass
  # ============================================================================
  test:
    needs: [changes, lint, type-check]  # Fail-fast: only run if code quality passes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids macOS .DS_Store lock issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          # Include runner.name to prevent cross-runner cache corruption (Issue #638)
          key: poetry-v7-${{ runner.name }}-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v7-${{ runner.name }}-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Force fresh venv if cache is corrupted or from different runner
          if [ -d ".venv" ]; then
            VENV_PYTHON=$(cat .venv/pyvenv.cfg 2>/dev/null | grep "^home" | cut -d= -f2 | tr -d ' ')
            if ! poetry run pytest --version >/dev/null 2>&1 || [ -z "$VENV_PYTHON" ]; then
              echo "⚠️ Cached venv appears corrupted, removing..."
              rm -rf .venv 2>/dev/null || true
            fi
          fi
          poetry install --no-interaction --no-root

      - name: Run tests with coverage
        working-directory: ./backend
        run: poetry run pytest tests/unit/ -m "not slow and not external" --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-reports
          path: backend/coverage.xml
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn
  # ============================================================================
  # NOTE: Docker build removed - it was causing Buildx conflicts and served
  # no purpose (the image was never used). Docker images are built by:
  # - docker-build.yml (pushes to ghcr.io for E2E reuse)
  # - e2e-tests.yml (builds via docker-compose for testing)
  # ============================================================================
