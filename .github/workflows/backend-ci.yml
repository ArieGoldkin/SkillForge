name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    # NOTE: Removed paths filter for pull_request due to GitHub Actions bug
    # where large PRs silently skip path-filtered workflows. Using dorny/paths-filter
    # in the 'changes' job instead for reliable path detection.
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Phase 0: Detect changes (workaround for GitHub Actions paths filter bug)
  # ============================================================================
  changes:
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  # ============================================================================
  # Phase 1: FAST GATES (30-60 sec) - Fail fast on code quality issues
  # ============================================================================
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids macOS .DS_Store lock issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-v6-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v6-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Force fresh venv if cache is corrupted (check ruff, since that's what this job uses)
          if [ -d ".venv" ] && ! poetry run ruff --version >/dev/null 2>&1; then
            echo "⚠️ Cached venv appears corrupted, removing..."
            rm -rf .venv
          fi
          poetry install --no-interaction --no-root

      - name: Run ruff linting
        working-directory: ./backend
        run: poetry run ruff check app/

      - name: Check ruff formatting
        working-directory: ./backend
        run: poetry run ruff format --check app/

  type-check:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids macOS .DS_Store lock issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-v6-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v6-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Force fresh venv if cache is corrupted (check ty, since that's what this job uses)
          if [ -d ".venv" ] && ! poetry run ty --version >/dev/null 2>&1; then
            echo "⚠️ Cached venv appears corrupted, removing..."
            rm -rf .venv
          fi
          poetry install --no-interaction --no-root

      - name: Run ty type check
        working-directory: ./backend
        run: poetry run ty check app/

  # ============================================================================
  # Phase 2: UNIT TESTS (2-3 min) - Only run if lint/type pass
  # ============================================================================
  test:
    needs: [changes, lint, type-check]  # Fail-fast: only run if code quality passes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids macOS .DS_Store lock issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-v6-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-v6-${{ runner.os }}-py3.13-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Force fresh venv if cache is corrupted (check pytest, since that's what this job uses)
          if [ -d ".venv" ] && ! poetry run pytest --version >/dev/null 2>&1; then
            echo "⚠️ Cached venv appears corrupted, removing..."
            rm -rf .venv
          fi
          poetry install --no-interaction --no-root

      - name: Run tests with coverage
        working-directory: ./backend
        run: poetry run pytest tests/unit/ -m "not external" --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          skip_validation: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-test-reports
          path: backend/coverage.xml
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn
  # ============================================================================
  # Phase 3: BUILD (3-4 min) - Only run if tests pass, cache for E2E reuse
  # ============================================================================
  build:
    needs: [changes, test]  # Only build if tests pass
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    timeout-minutes: 15  # Allow time for retries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker readiness (exponential backoff)
        run: |
          # Docker Desktop on macOS can be flaky - use exponential backoff
          MAX_RETRIES=12
          RETRY=0
          DELAY=2
          MAX_DELAY=30

          while [ $RETRY -lt $MAX_RETRIES ]; do
            # Test both 'docker info' and 'docker ps' - some failures only show in one
            if docker info >/dev/null 2>&1 && docker ps >/dev/null 2>&1; then
              echo "✓ Docker daemon ready after $RETRY retries"
              exit 0
            fi

            RETRY=$((RETRY + 1))
            echo "Docker not ready, waiting ${DELAY}s... (attempt $RETRY/$MAX_RETRIES)"
            sleep $DELAY

            # Exponential backoff with cap
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt $MAX_DELAY ]; then
              DELAY=$MAX_DELAY
            fi
          done
          echo "::error::Docker daemon not ready after $MAX_RETRIES attempts"
          docker info 2>&1 || true
          exit 1

      - name: Cleanup stale Buildx builders
        run: |
          # Remove all non-default builders to prevent conflicts
          for builder in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep -v '^default$' | grep -v '^desktop-linux$' || true); do
            echo "Removing stale builder: $builder"
            docker buildx rm "$builder" --force 2>/dev/null || true
          done
          docker buildx use default 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: skillforge-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Export to local Docker for potential local testing
          load: true

      - name: Verify Docker image
        run: |
          docker images skillforge-backend:${{ github.sha }}
          echo "Docker image built and cached successfully"
