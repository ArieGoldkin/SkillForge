name: Embeddings Validation (Weekly)

on:
  # Weekly run on Sunday at 3am UTC
  schedule:
    - cron: "0 3 * * 0"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      use_real_embeddings:
        description: "Use real OpenAI embeddings (vs deterministic)"
        required: false
        default: true
        type: boolean

permissions:
  pull-requests: read
  contents: read
  actions: read

concurrency:
  group: embeddings-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Real Embeddings
    runs-on: self-hosted
    timeout-minutes: 45

    # NOTE: Docker services removed - self-hosted macOS runners use local PostgreSQL 17
    # Setup: brew install postgresql@18 pgvector && brew services start postgresql@18
    # Database: createdb skillforge_test && psql -d skillforge_test -c "CREATE EXTENSION vector;"

    env:
      DATABASE_URL: postgresql+asyncpg://@localhost:5432/skillforge_test

    steps:
      # Pre-checkout cleanup: Remove .venv before git clean runs (avoids cross-runner cache issues)
      - name: Clean stale virtualenv
        run: rm -rf backend/.venv 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Python version
        run: python3 --version

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry Python
        working-directory: backend
        run: |
          # Ensure Poetry uses python3 (Homebrew doesn't provide 'python' symlink)
          poetry env use python3 || true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            backend/.venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.name }}-${{ runner.os }}-py3.13-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: |
          # Force fresh venv if cache is corrupted (check alembic, since that's what this job uses)
          if [ -d ".venv" ] && ! poetry run python -m alembic --version >/dev/null 2>&1; then
            echo "⚠️ Cached venv appears corrupted (alembic not found), removing..."
            rm -rf .venv 2>/dev/null || true
          fi
          poetry install --no-interaction --no-root

      - name: Setup database
        working-directory: backend
        run: |
          # Local PostgreSQL 17 with pgvector on self-hosted runner
          /usr/local/opt/postgresql@18/bin/psql -d skillforge_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          poetry run python -m alembic upgrade head

      - name: Load fixtures with real embeddings
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-unit-tests' }}
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS: ${{ inputs.use_real_embeddings == false && 'true' || 'false' }}
        run: |
          echo "Using real embeddings: ${{ inputs.use_real_embeddings != false }}"
          poetry run python scripts/load_expanded_fixtures.py --expanded --replace

      - name: Run evaluation with real embeddings
        id: evaluation
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-unit-tests' }}
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS: ${{ inputs.use_real_embeddings == false && 'true' || 'false' }}
        run: |
          # Run full evaluation pipeline
          poetry run python scripts/run_evaluation.py \
            --expanded \
            --output evaluation_results_real.json \
            --baseline app/evaluation/baselines/main.json \
            --regression-threshold 0.05

      - name: Compare against baseline
        if: always()
        working-directory: backend
        run: |
          # Generate comparison report
          poetry run python -c "
          import json
          from pathlib import Path
          from app.evaluation.metrics.regression import check_regression

          current = Path('evaluation_results_real.json')
          baseline = Path('app/evaluation/baselines/main.json')

          if current.exists() and baseline.exists():
              report = check_regression(current, baseline, threshold=0.05)
              print(report.to_markdown())

              # Save report
              with open('embeddings_validation_report.md', 'w') as f:
                  f.write(report.to_markdown())
          else:
              print('Missing files for comparison')
          "

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: embeddings-validation-${{ github.run_number }}
          path: |
            backend/evaluation_results_real.json
            backend/embeddings_validation_report.md
          retention-days: 90
          if-no-files-found: warn

      - name: Check for regressions
        if: always()
        working-directory: backend
        run: |
          # Report but don't fail - this is monitoring
          if [ -f evaluation_results_real.json ]; then
            STATUS=$(jq -r '.overall_status' evaluation_results_real.json 2>/dev/null || echo "unknown")
            PASSED=$(jq -r '.total_passed' evaluation_results_real.json 2>/dev/null || echo "?")
            TOTAL=$(jq -r '.total_examples' evaluation_results_real.json 2>/dev/null || echo "?")

            echo "## Weekly Embeddings Validation" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: $STATUS" >> $GITHUB_STEP_SUMMARY
            echo "- **Passed**: $PASSED / $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "- **Mode**: ${{ inputs.use_real_embeddings != false && 'Real OpenAI Embeddings' || 'Deterministic' }}" >> $GITHUB_STEP_SUMMARY

            if [ "$STATUS" = "fail" ]; then
              echo "::warning::Weekly embeddings validation detected failures"
            fi
          fi
