name: Mark Stale Issues

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  stale:
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Stale issue configuration
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity in the last 30 days.

            **Next Steps:**
            - If this issue is still relevant, please comment to keep it active
            - Add the `status:blocked` label if waiting on external dependencies
            - Close if no longer needed

            This issue will be closed in 7 days if no further activity occurs.
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'status:blocked,priority:critical,priority:high,pinned'

          # Stale PR configuration
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity in the last 14 days.

            **Next Steps:**
            - Rebase if there are conflicts
            - Request review if ready
            - Close if no longer needed

            This PR will be closed in 7 days if no further activity occurs.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'priority:critical,priority:high,work-in-progress'

          # General configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: false  # Process newest first
