# =============================================================================
# E2E Tests Workflow - SkillForge
# =============================================================================
# This workflow runs End-to-End tests with two modes:
#
# 1. LIGHTWEIGHT E2E (default): Runs on all PRs
#    - Tests UI rendering, navigation, API connectivity
#    - NO real LLM/embedding calls (mocked or disabled)
#    - Fast, cost-free, safe for fork PRs
#
# 2. FULL E2E WITH LLM (on-demand): Runs only when:
#    - Triggered manually with enable_llm_tests=true
#    - OR on push to main/dev branches (post-merge validation)
#    - Uses real API keys for OpenAI, LangSmith, Jina
#    - Tests actual AI workflow integration
#
# SECURITY:
# - Fork PRs NEVER receive secrets (GitHub security model)
# - Explicit fork protection condition added as defense-in-depth
# - Secrets are only passed to Docker when explicitly enabled
# - All API keys are masked in logs by GitHub Actions
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      enable_llm_tests:
        description: 'Enable full LLM integration tests (uses API credits)'
        required: false
        default: false
        type: boolean
      run_docker_mode:
        description: 'Run full Docker E2E (slower, for debugging container issues)'
        required: false
        default: false
        type: boolean

# Minimal permissions - only read access to repository contents
permissions:
  contents: read

# Prevent concurrent E2E runs on the same branch to avoid resource conflicts
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Environment Variables (non-sensitive, shared across jobs)
# =============================================================================
env:
  # Use cost-efficient model for E2E testing
  LLM_MODEL: gpt-4o-mini
  # E2E environment identifier
  ENVIRONMENT: e2e

jobs:
  # ===========================================================================
  # CHANGE DETECTION: Skip E2E for docs-only changes
  # ===========================================================================
  changes:
    runs-on: self-hosted
    outputs:
      source_code: ${{ steps.filter.outputs.source_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source_code:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/vite.config.ts'
              - 'frontend/playwright.config.ts'
              - 'frontend/e2e/**'
              - 'backend/app/**'
              - 'backend/pyproject.toml'
              - 'backend/poetry.lock'
              - 'backend/alembic/**'
              - '.github/workflows/e2e-tests.yml'
              - 'docker-compose.test.yml'
              - 'Dockerfile*'
              # Explicitly exclude docs
              - '!**/*.md'
              - '!**/README*'

  # ===========================================================================
  # SECURITY GATE: Determine if secrets should be used
  # ===========================================================================
  security-check:
    runs-on: self-hosted
    outputs:
      is_fork_pr: ${{ steps.check.outputs.is_fork_pr }}
      secrets_available: ${{ steps.check.outputs.secrets_available }}
      enable_llm: ${{ steps.check.outputs.enable_llm }}
    steps:
      - name: Check security context
        id: check
        run: |
          # Check if this is a fork PR (defense-in-depth, GitHub already protects secrets)
          IS_FORK_PR="false"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              IS_FORK_PR="true"
              echo "⚠️  Fork PR detected - secrets will NOT be available"
            fi
          fi
          echo "is_fork_pr=${IS_FORK_PR}" >> $GITHUB_OUTPUT

          # Check if secrets are configured (without exposing values)
          SECRETS_AVAILABLE="false"
          if [[ -n "${{ secrets.OPENAI_API_KEY }}" ]]; then
            SECRETS_AVAILABLE="true"
          fi
          echo "secrets_available=${SECRETS_AVAILABLE}" >> $GITHUB_OUTPUT

          # Determine if LLM tests should run:
          # - Manual trigger with enable_llm_tests=true
          # - OR push to main/dev (post-merge validation)
          # - AND NOT a fork PR
          # - AND secrets are available
          ENABLE_LLM="false"
          if [[ "${IS_FORK_PR}" == "false" && "${SECRETS_AVAILABLE}" == "true" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.enable_llm_tests }}" == "true" ]]; then
              ENABLE_LLM="true"
              echo "✓ LLM tests enabled via manual trigger"
            elif [[ "${{ github.event_name }}" == "push" ]]; then
              ENABLE_LLM="true"
              echo "✓ LLM tests enabled for push to protected branch"
            fi
          fi
          echo "enable_llm=${ENABLE_LLM}" >> $GITHUB_OUTPUT

          # Summary with full audit trail
          echo "## Security Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Event | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fork PR | ${IS_FORK_PR} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Available | ${SECRETS_AVAILABLE} |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Tests Enabled | ${ENABLE_LLM} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # LIGHTWEIGHT E2E: UI and API connectivity tests (no LLM calls)
  # ===========================================================================
  e2e-lightweight:
    runs-on: self-hosted
    needs: [changes, security-check]
    # Skip E2E for docs-only changes (README, markdown files)
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.source_code == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Create .auth directory for storageState
        working-directory: ./frontend
        run: |
          mkdir -p .auth
          echo "Created .auth directory for Playwright storageState"

      - name: Create .env.test from template (lightweight mode)
        working-directory: ./backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          # Create comprehensive .env.test for CI (lightweight E2E mode)
          cat > .env.test << EOF
          # =============================================================================
          # CI Test Environment Configuration (Lightweight E2E Mode)
          # =============================================================================

          # =============================================================================
          # Database Configuration
          # =============================================================================
          POSTGRES_USER=dev
          POSTGRES_PASSWORD=dev
          POSTGRES_DB=skillforge-test

          # =============================================================================
          # Redis Configuration
          # =============================================================================
          REDIS_PASSWORD=redis-dev

          # =============================================================================
          # LLM API Keys (From GitHub Secrets)
          # =============================================================================
          OPENAI_API_KEY=$OPENAI_API_KEY
          JINA_API_KEY=$JINA_API_KEY

          # =============================================================================
          # Langfuse Observability (Disabled for lightweight E2E)
          # =============================================================================
          LANGFUSE_ENABLED=false
          LANGFUSE_HOST=http://langfuse-web:3000

          # Langfuse Database Configuration
          LANGFUSE_POSTGRES_USER=langfuse
          LANGFUSE_POSTGRES_PASSWORD=langfuse
          LANGFUSE_POSTGRES_DB=langfuse

          # Langfuse Redis Configuration
          LANGFUSE_REDIS_PASSWORD=redis-dev

          # Clickhouse Configuration
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=langfuse

          # MinIO Configuration
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin

          # =============================================================================
          # Application Configuration
          # =============================================================================
          LLM_MODEL=gpt-4o-mini
          ENVIRONMENT=test
          LOG_LEVEL=INFO

          # =============================================================================
          # Security (Test Environment)
          # =============================================================================
          NEXTAUTH_SECRET=test-secret-ci-e2e
          NEXTAUTH_SALT=test-salt-ci-e2e
          LANGFUSE_ENCRYPTION_KEY=test-key-ci-e2e
          LANGFUSE_INIT_USER_PASSWORD=test

          # =============================================================================
          # Workflow Control (Lightweight Mode)
          # =============================================================================
          SKILLFORGE_E2E_DISABLE_WORKFLOW=true
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS=true
          EOF

          echo "✓ Created comprehensive .env.test for CI lightweight E2E mode"

      - name: Build and start test environment (lightweight mode)
        run: |
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          # Start ONLY essential services for lightweight E2E (no Langfuse stack)
          # Langfuse is disabled in .env.test, so don't waste CI resources starting it
          docker compose -f docker-compose.test.yml up -d --build \
            postgres redis backend frontend backend-seed

      - name: Wait for test environment to be ready
        run: |
          echo "Waiting for backend health check..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8501/api/v1/health >/dev/null 2>&1; then
              echo "✓ Backend healthy after $i attempts"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ Backend health check timed out"
              docker compose -f docker-compose.test.yml logs backend
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -fsS http://localhost:5174 >/dev/null 2>&1; then
              echo "✓ Frontend ready after $i attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Frontend health check timed out"
              docker compose -f docker-compose.test.yml logs frontend
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests (lightweight)
        working-directory: ./frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          API_BASE_URL: http://localhost:8501
          # Signal to tests that LLM is disabled
          E2E_LLM_DISABLED: "true"
        run: |
          # Track test execution time for performance metrics
          echo "## E2E Test Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          
          START_TIME=$(date +%s)
          
          # Global setup will create storageState.json
          # Verify it was created after test run
          npx playwright test --project=chromium
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "| Test Execution Time | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Workers (Parallel) | 4 |" >> $GITHUB_STEP_SUMMARY
          echo "| storageState Optimization | Enabled |" >> $GITHUB_STEP_SUMMARY
          
          # Validate storageState was created
          if [ -f ".auth/storageState.json" ]; then
            STATE_SIZE=$(stat -f%z .auth/storageState.json 2>/dev/null || stat -c%s .auth/storageState.json 2>/dev/null || echo 'unknown')
            echo "✅ storageState.json created successfully (${STATE_SIZE} bytes)"
            echo "| storageState File Size | ${STATE_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  storageState.json not found (tests may still pass, but optimization not active)"
            echo "| storageState File Size | Not created |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** With storageState optimization and 4 parallel workers, expected 50-70% time reduction vs sequential execution." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-lightweight
          path: frontend/playwright-report/
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results-lightweight
          path: frontend/test-results/
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          echo "## Docker Compose Logs (Test Environment)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -f docker-compose.test.yml logs --tail=100 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v --remove-orphans
          # Clean up any env files
          rm -f backend/.env.test

  # ===========================================================================
  # FULL E2E WITH LLM: Tests actual AI workflow integration
  # ===========================================================================
  e2e-with-llm:
    runs-on: self-hosted
    needs: [security-check, e2e-lightweight]
    # Only run if:
    # - Lightweight tests passed
    # - LLM tests are enabled (push to main/dev OR manual trigger)
    # - NOT a fork PR
    if: |
      needs.security-check.outputs.enable_llm == 'true' &&
      needs.security-check.outputs.is_fork_pr == 'false'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Create .auth directory for storageState
        working-directory: ./frontend
        run: |
          mkdir -p .auth
          echo "Created .auth directory for Playwright storageState"

      - name: Create .env.test from template (with LLM mode)
        working-directory: ./backend
        env:
          # Pass secrets to environment for .env.test creation
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          # Copy template as base
          cp .env.test.example .env.test

          # Set restricted permissions (600 = owner read/write only)
          chmod 600 .env.test

          # Append CI configuration with real API keys for LLM tests
          cat >> .env.test << EOF

          # =============================================================================
          # CI/CD Overrides (Full E2E with LLM)
          # =============================================================================
          ENVIRONMENT=test
          LOG_LEVEL=INFO

          # Enable workflow execution with real API keys
          SKILLFORGE_E2E_DISABLE_WORKFLOW=false

          # Real API keys for LLM integration tests
          OPENAI_API_KEY=${OPENAI_API_KEY}
          JINA_API_KEY=${JINA_API_KEY}

          # Use real embeddings (not deterministic)
          SKILLFORGE_DETERMINISTIC_EMBEDDINGS=false
          EOF

          echo "✓ Created .env.test for full E2E mode with real API keys"

      - name: Build and start E2E stack (with LLM + Langfuse)
        env:
          # Pass secrets to Docker Compose via environment
          # These are ONLY available when security-check passes
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          # Create .env file with restricted permissions (600 = owner read/write only)
          # This prevents other processes on shared runners from reading secrets
          touch .env.e2e
          chmod 600 .env.e2e
          cat > .env.e2e << EOF
          OPENAI_API_KEY=${OPENAI_API_KEY}
          JINA_API_KEY=${JINA_API_KEY}
          LLM_MODEL=gpt-4o-mini
          ENVIRONMENT=e2e
          # Enable workflow execution with real API keys
          SKILLFORGE_E2E_DISABLE_WORKFLOW=false
          # Langfuse Integration (E2E stack uses pre-configured keys)
          LANGFUSE_ENABLED=true
          LANGFUSE_HOST=http://langfuse-web-e2e:3000
          LANGFUSE_PUBLIC_KEY=pk-lf-ci-e2e-test
          LANGFUSE_SECRET_KEY=sk-lf-ci-e2e-test-secret
          EOF

          # Start test environment with real API keys + Langfuse stack - workflow ENABLED
          # Note: backend-seed loads golden dataset, langfuse-restore restores config
          docker compose -f docker-compose.test.yml \
            --env-file .env.e2e up -d --build \
            postgres redis backend frontend backend-seed \
            langfuse-web langfuse-worker langfuse-db langfuse-clickhouse \
            langfuse-redis langfuse-minio langfuse-minio-setup langfuse-restore

          # Secure cleanup - overwrite before deletion (defense in depth)
          shred -u .env.e2e 2>/dev/null || rm -f .env.e2e

      - name: Wait for test environment to be ready
        run: |
          echo "Waiting for backend health check..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8501/api/v1/health >/dev/null 2>&1; then
              echo "✓ Backend healthy after $i attempts"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ Backend health check timed out"
              docker compose -f docker-compose.test.yml logs backend
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -fsS http://localhost:5174 >/dev/null 2>&1; then
              echo "✓ Frontend ready after $i attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Frontend health check timed out"
              docker compose -f docker-compose.test.yml logs frontend
              exit 1
            fi
            sleep 2
          done

          # Verify API key configuration in logs (without exposing values)
          echo "Checking API key configuration..."
          docker compose -f docker-compose.test.yml logs backend 2>&1 | grep -q "api_key_configuration" && \
            echo "✓ API key validation logged" || \
            echo "⚠️  API key validation not found in logs"

      - name: Wait for Langfuse observability stack
        run: |
          echo "Waiting for Langfuse observability..."
          for i in {1..60}; do
            if curl -fsS http://localhost:3001/api/public/health >/dev/null 2>&1; then
              echo "✓ Langfuse ready after $i attempts"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "⚠️  Langfuse health check timed out (observability may be unavailable)"
              # Don't fail - Langfuse is optional for core E2E tests
              break
            fi
            sleep 2
          done

      - name: Verify Langfuse config restored
        run: |
          echo "Checking Langfuse restore logs..."
          docker compose -f docker-compose.test.yml logs langfuse-restore | tail -20 || \
            echo "⚠️  Langfuse restore logs not found (may have completed already)"

          # Export test IDs from golden dataset (first analysis)
          echo "E2E_ARTIFACT_ID=test-artifact-001" >> $GITHUB_ENV
          echo "E2E_ANALYSIS_ID=test-analysis-001" >> $GITHUB_ENV
          echo "E2E_TRACE_ID=test-trace-langfuse-integration" >> $GITHUB_ENV

      - name: Run Playwright tests (with LLM + Langfuse)
        working-directory: ./frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          API_BASE_URL: http://localhost:8501
          # Signal to tests that LLM is enabled
          E2E_LLM_ENABLED: "true"
          # Langfuse test configuration
          E2E_ARTIFACT_ID: ${{ env.E2E_ARTIFACT_ID }}
          E2E_ANALYSIS_ID: ${{ env.E2E_ANALYSIS_ID }}
          E2E_TRACE_ID: ${{ env.E2E_TRACE_ID }}
          LANGFUSE_URL: http://localhost:3001
          LANGFUSE_EMAIL: test@skillforge.local
          LANGFUSE_PASSWORD: test
        run: |
          # Track test execution time for performance metrics
          echo "## E2E Test Performance Metrics (with LLM)" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          
          START_TIME=$(date +%s)
          
          # Run full test suite including LLM and Langfuse integration tests
          # Global setup will create storageState.json for optimization
          npx playwright test --project=chromium
          
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "| Test Execution Time | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Workers (Parallel) | 4 |" >> $GITHUB_STEP_SUMMARY
          echo "| storageState Optimization | Enabled |" >> $GITHUB_STEP_SUMMARY
          
          # Validate storageState was created
          if [ -f ".auth/storageState.json" ]; then
            STATE_SIZE=$(stat -f%z .auth/storageState.json 2>/dev/null || stat -c%s .auth/storageState.json 2>/dev/null || echo 'unknown')
            echo "✅ storageState.json created successfully (${STATE_SIZE} bytes)"
            echo "| storageState File Size | ${STATE_SIZE} bytes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️  storageState.json not found (tests may still pass, but optimization not active)"
            echo "| storageState File Size | Not created |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** With storageState optimization and 4 parallel workers, expected 50-70% time reduction vs sequential execution." >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-with-llm
          path: frontend/playwright-report/
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results-with-llm
          path: frontend/test-results/
          compression-level: 9
          retention-days: 7
          if-no-files-found: warn

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          echo "## Docker Compose Logs (Test Environment with LLM + Langfuse)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Comprehensive API key filtering for all supported LLM providers
          # Patterns: OpenAI, Anthropic, LangChain, Jina, Google, xAI, DeepSeek, generic, Langfuse
          docker compose -f docker-compose.test.yml logs --tail=100 2>&1 | \
            sed 's/sk-proj-[a-zA-Z0-9_-]*/sk-proj-***REDACTED***/g' | \
            sed 's/sk-ant-[a-zA-Z0-9_-]*/sk-ant-***REDACTED***/g' | \
            sed 's/sk-lf-[a-zA-Z0-9_-]*/sk-lf-***REDACTED***/g' | \
            sed 's/pk-lf-[a-zA-Z0-9_-]*/pk-lf-***REDACTED***/g' | \
            sed 's/sk-[a-zA-Z0-9_-]*/sk-***REDACTED***/g' | \
            sed 's/lsv2_[a-zA-Z0-9_]*/lsv2_***REDACTED***/g' | \
            sed 's/jina_[a-zA-Z0-9_]*/jina_***REDACTED***/g' | \
            sed -E 's/AIza[a-zA-Z0-9_-]{35}/AIza***REDACTED***/g' | \
            sed 's/xai-[a-zA-Z0-9_-]*/xai-***REDACTED***/g' | \
            sed 's/Bearer [a-zA-Z0-9_.-]*/Bearer ***REDACTED***/g' | \
            sed -E 's/(password|secret|token|api_key)=[^ ]*/\1=***REDACTED***/gi' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Langfuse-specific diagnostics
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Langfuse Health Check" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s http://localhost:3001/api/public/health >> $GITHUB_STEP_SUMMARY 2>&1 || \
            echo "Langfuse health check failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v --remove-orphans
          # Secure cleanup - ensure no env files remain
          shred -u backend/.env.test 2>/dev/null || rm -f backend/.env.test
          rm -f .env.e2e .env

  # ===========================================================================
  # DOCKER MODE: Full containerized E2E (debugging only)
  # ===========================================================================
  e2e-docker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_mode == true }}
    runs-on: self-hosted
    needs: security-check
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run E2E tests in Docker
        run: |
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          docker compose -f docker-compose.e2e.yml up --build --exit-code-from e2e

      - name: Upload Docker test report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-docker
          path: frontend/playwright-report/
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
