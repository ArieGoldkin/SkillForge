name: E2E Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
      - 'docker-compose.e2e.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
      - 'docker-compose.e2e.yml'
  workflow_dispatch:
    inputs:
      run_docker_mode:
        description: 'Run full Docker E2E (slower, for debugging container issues)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # E2E Tests - Primary job using Docker Compose with BuildKit caching
  # ============================================================================
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build and start E2E stack
        run: |
          # Use BuildKit for better layer caching
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          # Build and start services
          docker compose -f docker-compose.e2e.yml up -d --build postgres backend-migrate backend backend-seed frontend-e2e

      - name: Wait for E2E stack to be ready
        run: |
          echo "Waiting for backend health check..."
          for i in {1..60}; do
            if curl -fsS http://localhost:8500/api/v1/health >/dev/null 2>&1; then
              echo "✓ Backend healthy after $i attempts"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ Backend health check timed out"
              docker compose -f docker-compose.e2e.yml logs backend
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for frontend..."
          for i in {1..30}; do
            if curl -fsS http://localhost:5174 >/dev/null 2>&1; then
              echo "✓ Frontend ready after $i attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Frontend health check timed out"
              docker compose -f docker-compose.e2e.yml logs frontend-e2e
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:5174
          API_BASE_URL: http://localhost:8500
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          echo "## Docker Compose Logs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -f docker-compose.e2e.yml logs --tail=100 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  # ============================================================================
  # Full Docker E2E - Only runs on manual dispatch for debugging
  # ============================================================================
  e2e-docker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docker_mode == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run E2E tests in Docker
        run: |
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          docker compose -f docker-compose.e2e.yml up --build --exit-code-from e2e

      - name: Upload Docker test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-docker
          path: frontend/playwright-report/
          retention-days: 14

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
