name: 'Setup Playwright'
description: 'Install Node.js, dependencies, and Playwright browsers with caching'
inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '20'
  working-directory:
    description: 'Frontend working directory'
    required: false
    default: './frontend'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx playwright install --with-deps chromium

    - name: Create fresh .auth directory for storageState
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Clean up stale storageState from previous runs on self-hosted runners
        rm -rf .auth
        mkdir -p .auth
        echo "Created fresh .auth directory for Playwright storageState"
