name: 'Setup Playwright'
description: 'Install Node.js, dependencies, and Playwright browsers with caching'
inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '20'
  working-directory:
    description: 'Frontend working directory'
    required: false
    default: './frontend'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install frontend dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Check Playwright browsers and install if needed
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # On self-hosted runners, browsers persist between runs
        # Check if chromium is already installed to avoid 7GB download
        PLAYWRIGHT_BROWSERS_PATH="${HOME}/.cache/ms-playwright"

        if [ -d "${PLAYWRIGHT_BROWSERS_PATH}" ] && ls "${PLAYWRIGHT_BROWSERS_PATH}"/chromium-* 1>/dev/null 2>&1; then
          echo "✓ Playwright Chromium already installed, skipping download"
          ls -la "${PLAYWRIGHT_BROWSERS_PATH}"/chromium-* | head -3
        else
          echo "⏳ Installing Playwright Chromium (this may take a few minutes)..."
          npx playwright install --with-deps chromium
          echo "✓ Playwright Chromium installed"
        fi

    - name: Create fresh .auth directory for storageState
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Clean up stale storageState from previous runs on self-hosted runners
        rm -rf .auth
        mkdir -p .auth
        echo "Created fresh .auth directory for Playwright storageState"
