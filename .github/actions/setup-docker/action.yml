name: 'Setup Docker with Layer Caching'
description: 'Configure Docker Buildx with multi-layer caching for faster builds'
inputs:
  cache-path:
    description: 'Path to Docker layer cache'
    required: false
    default: '/tmp/.buildx-cache'

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest
          network=host
      timeout-minutes: 5
      continue-on-error: true  # Buildx is optional - native BuildKit works too

    - name: Cache Docker layers
      uses: actions/cache@v5
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ runner.os }}-buildx-${{ hashFiles('**/Dockerfile*', '**/poetry.lock', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Configure Docker BuildKit cache
      shell: bash
      run: |
        # Enable BuildKit caching for docker compose builds
        echo "BUILDKIT_INLINE_CACHE=1" >> $GITHUB_ENV
        echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
        echo "COMPOSE_DOCKER_CLI_BUILD=1" >> $GITHUB_ENV

        # Configure BuildKit to use cache mount
        mkdir -p ${{ inputs.cache-path }}

        echo "✓ Docker BuildKit caching configured"

    - name: Verify Docker readiness and cleanup
      shell: bash
      run: |
        # Wait for Docker daemon to be fully ready
        echo "Checking Docker daemon health..."
        for i in {1..30}; do
          if docker info >/dev/null 2>&1; then
            echo "✓ Docker ready after $i attempts"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "✗ Docker not ready after 30 attempts"
            exit 1
          fi
          echo "Waiting for Docker... ($i/30)"
          sleep 2
        done

        # Verify Docker API is responsive
        docker version

        # Clean up stale test containers/volumes from previous runs
        echo "Cleaning up stale test resources..."
        docker compose -f docker-compose.test.yml down -v --remove-orphans 2>/dev/null || true

        # Remove any dangling containers from previous runs
        docker container prune -f 2>/dev/null || true

        # Verify no stale skillforge-test containers exist
        if docker ps -a | grep -q "skillforge.*test"; then
          echo "⚠️  Found stale containers, force removing..."
          docker rm -f $(docker ps -aq -f name="skillforge.*test") 2>/dev/null || true
        fi

        echo "✓ Docker ready and clean"
