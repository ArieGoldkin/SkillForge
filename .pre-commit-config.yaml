# Pre-commit hooks configuration for SkillForge
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Python code formatting and linting (uses local poetry-managed ruff to match CI)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && poetry run ruff check app/ --fix --exit-non-zero-on-fix'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && poetry run ruff format --check app/'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
        types: [python]

  # Python type checking - runs mypy on backend/app directory
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && poetry run mypy app/'
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
        types: [python]

  # Frontend (if exists)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@9.17.0
        entry: bash -c 'cd frontend && npm run lint || true'
        pass_filenames: false
        always_run: false

  # YAML formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [yaml]
        exclude: ^(.github/workflows/|docker-compose)

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        files: \.(sh|bash)$

# Exclude patterns
exclude: |
  (?x)^(
    \.claude/|
    \.squad/|
    .*\.lock|
    .*\.pyc|
    .*\.pyo|
    __pycache__|
    .venv|
    venv|
    node_modules|
    .git|
    dist|
    build|
    .pytest_cache|
    htmlcov|
    .coverage
  )
