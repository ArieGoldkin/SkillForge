## Docker Compose for Test Environment (Full Dev Mirror)
## Usage:
##   docker compose -f docker-compose.test.yml up -d
##
## This stack runs:
## - Postgres (pgvector) - skillforge-test database
## - Redis - redis-test
## - Backend - backend-test
## - Frontend - frontend-test
## - Langfuse (all services) - langfuse-*-test
## - Seed service - loads golden dataset
## - Langfuse restore - restores Langfuse config from backups
##
## Ports (offset by 1 from dev):
## - Postgres: 5438
## - Redis: 6381
## - Backend: 8501
## - Frontend: 5174
## - Langfuse Web: 3001
## - MinIO: 9001 (API), 9002 (Console)

name: skillforge-test

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: skillforge-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: skillforge-test
    ports:
      - "5438:5432"  # Test port (dev uses 5437)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d skillforge-test"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: skillforge-redis-test
    ports:
      - "6381:6379"  # Test port (dev uses 6380)
    environment:
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD:-redis-dev}
        --timeout 0
        --tcp-keepalive 60
        --maxclients 1000
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-test-data:/data
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: skillforge-backend-test
    env_file:
      - ./backend/.env.test  # Test environment uses separate .env.test file
    environment:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/skillforge-test
      API_V1_PREFIX: /api/v1
      HOST: 0.0.0.0
      PORT: 8500
      CORS_ORIGINS: '["http://localhost:5174","http://localhost:5175"]'
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev}@redis:6379
      # Langfuse: Override localhost with Docker network hostname
      LANGFUSE_HOST: http://langfuse-web:3000
      # Workflow control: Enable workflows by default (requires API keys from .env)
      # Set to "true" to disable workflows for lightweight/cost-free tests
      SKILLFORGE_E2E_DISABLE_WORKFLOW: ${SKILLFORGE_E2E_DISABLE_WORKFLOW:-false}
      # API keys are loaded from ./backend/.env via env_file above
      # Required for full LLM workflows: OPENAI_API_KEY, JINA_API_KEY, etc.
    ports:
      - "8501:8500"  # Test port (dev uses 8500)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Mount code for hot reload (development)
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      # Mount scripts directory for seed/restore services
      - ./backend/scripts:/app/scripts:ro
      # Mount Langfuse backups for restore
      - ./backend/data/langfuse_backups:/app/data/langfuse_backups:ro
      # Mount data directory for golden dataset
      - ./backend/data:/app/data:ro
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -U dev -d skillforge-test; do sleep 2; done &&
        echo 'Running migrations...' &&
        /app/.venv/bin/alembic upgrade head &&
        echo 'Starting backend...' &&
        /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8500 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: skillforge-frontend-test
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:8501
    ports:
      - "5174:5173"  # Test port (dev uses 5173)
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # LANGFUSE v3 OBSERVABILITY STACK (Test Environment)
  # =============================================================================

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: skillforge-langfuse-web-test
    ports:
      - "3001:3000"  # Test port (dev uses 3000)
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-langfuse}@langfuse-clickhouse:9000/langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-redis-dev}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      SALT: ${NEXTAUTH_SALT:-dev-salt-change-in-production}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-dev-key-change-in-production}
      NEXTAUTH_URL: http://localhost:3001
      LANGFUSE_INIT_ORG_ID: skillforge-org-test
      LANGFUSE_INIT_ORG_NAME: SkillForge Test
      LANGFUSE_INIT_PROJECT_ID: skillforge-test
      LANGFUSE_INIT_PROJECT_NAME: SkillForge Test Backend
      LANGFUSE_INIT_USER_EMAIL: test@skillforge.local
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-test}
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      # Use localhost:3000 from inside container, not service name
      test: ["CMD-SHELL", "wget -q -O- --timeout=5 http://localhost:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - default

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: skillforge-langfuse-worker-test
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-langfuse}@langfuse-clickhouse:9000/langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-redis-dev}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: ${NEXTAUTH_SALT:-dev-salt-change-in-production}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-dev-key-change-in-production}
    depends_on:
      langfuse-web:
        condition: service_healthy
    networks:
      - default

  langfuse-db:
    image: postgres:16-alpine
    container_name: skillforge-langfuse-db-test
    environment:
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse}
    volumes:
      - langfuse-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: skillforge-langfuse-clickhouse-test
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-langfuse}
    volumes:
      - langfuse-clickhouse-test-data:/var/lib/clickhouse
      - langfuse-clickhouse-test-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default

  langfuse-redis:
    image: redis:7-alpine
    container_name: skillforge-langfuse-redis-test
    command: redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD:-redis-dev}
    volumes:
      - langfuse-redis-test-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-redis-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-minio:
    image: minio/minio:latest
    container_name: skillforge-langfuse-minio-test
    command: server /data --console-address ":9002"
    ports:
      - "9002:9000"   # S3 API (test port, dev uses 9000)
      - "9003:9001"   # MinIO Console (test port, dev uses 9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - langfuse-minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-minio-setup:
    image: minio/mc:latest
    container_name: skillforge-langfuse-minio-setup-test
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://langfuse-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb minio/langfuse --ignore-existing;
      exit 0;
      "
    networks:
      - default

  # =============================================================================
  # SEED SERVICE - Load Golden Dataset
  # =============================================================================
  backend-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: skillforge-backend-seed-test
    env_file:
      - ./backend/.env.test  # Test environment uses separate .env.test file.test  # Test environment uses separate .env.test file
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@postgres:5432/skillforge-test
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/scripts:/app/scripts:ro
      - ./backend/data:/app/data:ro
    command: >
      sh -c "
        echo 'Waiting for backend to be ready...' &&
        until curl -f http://backend:8500/api/v1/health; do sleep 2; done &&
        echo 'Loading golden dataset...' &&
        cd /app && /app/.venv/bin/python scripts/load_golden_dataset.py &&
        echo 'Golden dataset loaded successfully'
      "
    restart: "no"

  # =============================================================================
  # LANGFUSE RESTORE SERVICE - Restore Langfuse Config from Backups
  # =============================================================================
  langfuse-restore:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: skillforge-langfuse-restore-test
    env_file:
      - ./backend/.env.test  # Test environment uses separate .env.test file.test  # Test environment uses separate .env.test file
    environment:
      ENVIRONMENT: test
      # LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are loaded from .env.test via env_file
      LANGFUSE_HOST: http://langfuse-web:3000
    depends_on:
      langfuse-web:
        condition: service_healthy
      langfuse-db:
        condition: service_healthy
    volumes:
      - ./backend/scripts:/app/scripts:ro
      - ./backend/data/langfuse_backups:/app/data/langfuse_backups:ro
    command: >
      sh -c "
        echo 'Waiting for Langfuse to be ready...' &&
        until curl -f http://langfuse-web:3000/api/public/health; do sleep 2; done &&
        sleep 5 &&
        echo 'Checking Langfuse credentials...' &&
        if [ -n \"$$LANGFUSE_PUBLIC_KEY\" ] && [ -n \"$$LANGFUSE_SECRET_KEY\" ]; then
          echo 'Restoring Langfuse configurations from backups...' &&
          /app/.venv/bin/python scripts/backup_langfuse.py restore || echo 'Warning: Langfuse restore failed' &&
          /app/.venv/bin/python scripts/setup_langfuse_score_configs.py || echo 'Warning: Score configs setup failed' &&
          /app/.venv/bin/python scripts/setup_langfuse_annotation_queue.py || echo 'Warning: Annotation queue setup failed' &&
          echo 'Langfuse configuration restored'
        else
          echo 'Skipping Langfuse restore: LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY not set (optional for lightweight tests)'
        fi
      "
    restart: "no"

volumes:
  postgres-test-data:
  redis-test-data:
  langfuse-postgres-test-data:
  langfuse-clickhouse-test-data:
  langfuse-clickhouse-test-logs:
  langfuse-redis-test-data:
  langfuse-minio-test-data:

