# Docker Compose for E2E Testing (Real Backend)
# Usage: docker compose -f docker-compose.e2e.yml up --build
#
# PREREQUISITE: Main stack must be running first:
#   docker compose up -d
#
# This configuration runs E2E tests against the REAL backend and database.

name: skillforge

services:
  # Frontend for E2E testing (connects to real backend)
  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: skillforge-frontend-e2e
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://skillforge-backend-dev:8500
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Playwright E2E test runner (tests against real backend)
  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: e2e
    container_name: skillforge-e2e-runner
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://frontend-e2e:5173
      # Tell tests to use real backend (no mocks)
      E2E_USE_REAL_BACKEND: "true"
      API_BASE_URL: http://skillforge-backend-dev:8500
    depends_on:
      frontend-e2e:
        condition: service_healthy
    volumes:
      - ./frontend/test-results:/app/test-results
      - ./frontend/playwright-report:/app/playwright-report
    command: >
      sh -c "
        echo 'Waiting for frontend and backend...' &&
        sleep 5 &&
        echo 'Running E2E tests against REAL backend...' &&
        npx playwright test --project=chromium --reporter=list,html
      "

networks:
  default:
    name: skillforge_default
    external: true
