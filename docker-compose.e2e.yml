## Docker Compose for E2E Testing (CI-friendly, self-contained)
## Usage (local):
##   docker compose -f docker-compose.e2e.yml up --build
##
## This stack runs:
## - Postgres (pgvector)
## - Backend (migrations applied)
## - Optional seed (one completed analysis + artifact for UI tests)
## - Frontend (Vite dev server)
##
## CI runs Playwright from the runner, targeting:
## - Frontend: http://localhost:5174
## - Backend:  http://localhost:8500

name: skillforge-e2e

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: skillforge-postgres-e2e
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillforge_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillforge_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillforge-backend-migrate-e2e
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/skillforge_test
      ENVIRONMENT: e2e
    command: ["sh", "-c", "alembic upgrade head"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillforge-backend-e2e
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/skillforge_test
      ENVIRONMENT: e2e
      # Allow the CI E2E suite to create analyses without triggering expensive workflows
      # Set to "false" when API keys are provided to enable full workflow testing
      SKILLFORGE_E2E_DISABLE_WORKFLOW: ${SKILLFORGE_E2E_DISABLE_WORKFLOW:-true}
      # CORS for both local dev server (5173) and CI-exposed port (5174)
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'
      # === API Keys (optional - passed via .env file or environment) ===
      # When set, enables full LLM workflow testing
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      # LangSmith tracing (optional)
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-skillforge-e2e}
      # Model configuration (use cost-efficient model for E2E)
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillforge-backend-seed-e2e
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/skillforge_test
    command: ["python", "-m", "scripts.seed_e2e_fixture"]
    restart: "no"

  # Frontend for E2E testing (connects to real backend)
  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: skillforge-frontend-e2e
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://backend:8500
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Playwright E2E test runner (tests against real backend)
  e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: e2e
    container_name: skillforge-e2e-runner
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://frontend-e2e:5173
      # Tell tests to use real backend (no mocks)
      E2E_USE_REAL_BACKEND: "true"
      API_BASE_URL: http://backend:8500
    depends_on:
      frontend-e2e:
        condition: service_healthy
    volumes:
      - ./frontend/test-results:/app/test-results
      - ./frontend/playwright-report:/app/playwright-report
    command: >
      sh -c "
        echo 'Waiting for frontend and backend...' &&
        sleep 5 &&
        echo 'Running E2E tests against REAL backend...' &&
        npx playwright test --project=chromium --reporter=list,html
      "
