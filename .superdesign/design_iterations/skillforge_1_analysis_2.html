<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Progress - Modern Minimal - SkillForge</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Modern 2025 Theme - Minimal & Clean */
        :root {
            --bg: #fafafa;
            --bg-card: #ffffff;
            --text: #18181b;
            --text-muted: #71717a;
            --text-subtle: #a1a1aa;
            --border: #e4e4e7;
            --border-hover: #d4d4d8;
            --accent: #10b981;
            --accent-soft: #d1fae5;
            --warning: #f59e0b;
            --warning-soft: #fef3c7;
            --surface: #f4f4f5;
        }

        .dark {
            --bg: #09090b;
            --bg-card: #18181b;
            --text: #fafafa;
            --text-muted: #a1a1aa;
            --text-subtle: #71717a;
            --border: #27272a;
            --border-hover: #3f3f46;
            --accent: #34d399;
            --accent-soft: #064e3b;
            --warning: #fbbf24;
            --warning-soft: #451a03;
            --surface: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            background-color: var(--bg) !important;
            color: var(--text) !important;
            line-height: 1.5 !important;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ========== ANIMATIONS ========== */

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes expandContent {
            from {
                opacity: 0;
                max-height: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                max-height: 500px;
                transform: translateY(0);
            }
        }

        @keyframes collapseContent {
            from {
                opacity: 1;
                max-height: 500px;
            }
            to {
                opacity: 0;
                max-height: 0;
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Stagger delays */
        .delay-1 { animation-delay: 0ms; }
        .delay-2 { animation-delay: 80ms; }
        .delay-3 { animation-delay: 160ms; }
        .delay-4 { animation-delay: 240ms; }
        .delay-5 { animation-delay: 320ms; }
        .delay-6 { animation-delay: 400ms; }

        /* ========== LAYOUT ========== */

        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }

        .header-inner {
            max-width: 640px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--text);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .icon-btn:hover {
            background: var(--surface);
            color: var(--text);
        }

        /* ========== MAIN CONTENT ========== */

        .main-content {
            flex: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px 100px;
        }

        .content-header {
            margin-bottom: 24px;
            opacity: 0;
        }

        .content-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .content-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--surface);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .progress-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* ========== AGENT CARDS - COMPACT & COLLAPSIBLE ========== */

        .agents-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .agent-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
            opacity: 0;
        }

        .agent-card:hover {
            border-color: var(--border-hover);
        }

        .agent-card.complete {
            border-left: 2px solid var(--accent);
        }

        .agent-card.running {
            border-left: 2px solid var(--warning);
        }

        .agent-card.queued {
            opacity: 0.5;
            border-style: dashed;
        }

        /* Collapsed Header - Always Visible */
        .agent-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .agent-header:hover {
            background: var(--surface);
        }

        .agent-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .agent-icon.extractor { background: #dbeafe; color: #2563eb; }
        .agent-icon.supervisor { background: #fef3c7; color: #d97706; }
        .agent-icon.tech { background: #ede9fe; color: #7c3aed; }
        .agent-icon.security { background: #d1fae5; color: #059669; }
        .agent-icon.implementation { background: #fce7f3; color: #db2777; }
        .agent-icon.quality { background: #e0e7ff; color: #4f46e5; }

        .dark .agent-icon.extractor { background: #1e3a5f; color: #60a5fa; }
        .dark .agent-icon.supervisor { background: #451a03; color: #fbbf24; }
        .dark .agent-icon.tech { background: #2e1065; color: #a78bfa; }
        .dark .agent-icon.security { background: #064e3b; color: #34d399; }
        .dark .agent-icon.implementation { background: #500724; color: #f472b6; }
        .dark .agent-icon.quality { background: #1e1b4b; color: #818cf8; }

        .agent-info {
            flex: 1;
            min-width: 0;
        }

        .agent-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .agent-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.complete { background: var(--accent); }
        .status-dot.running { background: var(--warning); animation: pulse 1.5s ease-in-out infinite; }
        .status-dot.queued { background: var(--text-subtle); }

        .agent-preview {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .expand-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: var(--text-subtle);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .expand-btn svg {
            transition: transform 0.2s ease;
        }

        .agent-card.expanded .expand-btn svg {
            transform: rotate(180deg);
        }

        .agent-card.expanded .expand-btn {
            color: var(--text-muted);
        }

        /* Expanded Content - Hidden by Default */
        .agent-content {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.25s ease;
        }

        .agent-card.expanded .agent-content {
            max-height: 500px;
            opacity: 1;
        }

        .agent-content-inner {
            padding: 0 14px 14px 58px;
        }

        .agent-description {
            font-size: 13px;
            color: var(--text);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .process-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .process-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .process-step .step-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .process-step.complete .step-icon { color: var(--accent); }
        .process-step.running .step-icon { color: var(--warning); }

        .selected-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .agent-tag {
            padding: 4px 8px;
            background: var(--surface);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--warning);
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        .timestamp {
            font-size: 11px;
            color: var(--text-subtle);
            margin-top: 10px;
        }

        /* ========== FOOTER ========== */

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
        }

        .footer-inner {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-muted);
        }

        .btn:hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        .btn-ghost {
            border: none;
            background: transparent;
        }

        .btn-ghost:hover {
            background: var(--surface);
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <a href="skillforge_1.html" class="back-link">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back</span>
                </a>
                <div class="header-actions">
                    <button class="icon-btn" onclick="expandAll()" title="Expand all">
                        <i data-lucide="chevrons-down" class="w-4 h-4"></i>
                    </button>
                    <button class="icon-btn" onclick="collapseAll()" title="Collapse all">
                        <i data-lucide="chevrons-up" class="w-4 h-4"></i>
                    </button>
                    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
                        <i data-lucide="moon" class="w-4 h-4" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header animate-fade-in delay-1" style="opacity: 1;">
                <h1 class="content-title">React Server Components</h1>
                <div class="content-subtitle">
                    <span>Analyzing documentation...</span>
                    <span class="progress-pill">
                        <span class="dot"></span>
                        <span id="progressText">3 of 5</span>
                    </span>
                </div>
            </div>

            <div class="agents-list" id="agentsList">
                <!-- Agent cards will be inserted here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-inner">
                <button class="btn btn-ghost" onclick="resetDemo()">
                    Reset Demo
                </button>
                <button class="btn" onclick="toggleAllCards()">
                    Toggle All
                </button>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // Agent data
        const agents = [
            {
                id: 'extractor',
                name: 'Content Extractor',
                icon: 'file-search',
                iconClass: 'extractor',
                preview: 'Extracted 2,500 words from article',
                description: 'Successfully fetched and parsed content from the provided URL.',
                steps: [
                    { text: 'Extracted 2,500 words', status: 'complete' },
                    { text: 'Detected technical documentation', status: 'complete' },
                    { text: 'Found 8 code snippets', status: 'complete' }
                ],
                status: 'complete',
                timestamp: '12:34:08'
            },
            {
                id: 'supervisor',
                name: 'Supervisor',
                icon: 'network',
                iconClass: 'supervisor',
                preview: 'Assigned 4 specialist agents',
                description: 'Analyzed content type and complexity to determine optimal agent routing.',
                selectedAgents: ['Tech Comparator', 'Security Auditor', 'Implementation Planner', 'Code Quality'],
                status: 'complete',
                timestamp: '12:34:12'
            },
            {
                id: 'tech',
                name: 'Tech Comparator',
                icon: 'git-compare',
                iconClass: 'tech',
                preview: 'Compared with 3 alternatives',
                description: 'Analyzed React Server Components against alternative approaches.',
                steps: [
                    { text: 'RSC vs Traditional SSR', status: 'complete' },
                    { text: 'Found 3 migration patterns', status: 'complete' },
                    { text: 'Performance trade-offs documented', status: 'complete' }
                ],
                status: 'complete',
                timestamp: '12:34:22'
            },
            {
                id: 'security',
                name: 'Security Auditor',
                icon: 'shield',
                iconClass: 'security',
                preview: 'Scanning security patterns...',
                description: 'Analyzing code for potential security vulnerabilities and best practices.',
                steps: [
                    { text: 'Authentication patterns', status: 'complete' },
                    { text: 'CORS configuration', status: 'running' },
                    { text: 'Input sanitization', status: 'pending' }
                ],
                status: 'running',
                timestamp: null
            },
            {
                id: 'implementation',
                name: 'Implementation Planner',
                icon: 'list-checks',
                iconClass: 'implementation',
                preview: 'Waiting...',
                description: 'Will create step-by-step implementation guide.',
                steps: [],
                status: 'queued',
                timestamp: null
            },
            {
                id: 'quality',
                name: 'Code Quality',
                icon: 'badge-check',
                iconClass: 'quality',
                preview: 'Waiting...',
                description: 'Will review code quality and suggest improvements.',
                steps: [],
                status: 'queued',
                timestamp: null
            }
        ];

        let expandedCards = new Set();

        function createAgentCard(agent, index) {
            const isExpanded = expandedCards.has(agent.id);

            let stepsHtml = '';
            if (agent.steps && agent.steps.length > 0) {
                stepsHtml = `
                    <div class="process-steps">
                        ${agent.steps.map(step => `
                            <div class="process-step ${step.status}">
                                <span class="step-icon">
                                    ${step.status === 'complete' ? '<i data-lucide="check" class="w-3 h-3"></i>' :
                                      step.status === 'running' ? '<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>' :
                                      '<i data-lucide="circle" class="w-3 h-3"></i>'}
                                </span>
                                <span>${step.text}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (agent.status === 'running') {
                stepsHtml += `
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
            }

            let selectedAgentsHtml = '';
            if (agent.selectedAgents) {
                selectedAgentsHtml = `
                    <div class="selected-agents">
                        ${agent.selectedAgents.map(a => `<span class="agent-tag">${a}</span>`).join('')}
                    </div>
                `;
            }

            return `
                <div class="agent-card ${agent.status} ${isExpanded ? 'expanded' : ''} animate-fade-in delay-${index + 1}"
                     data-id="${agent.id}"
                     style="opacity: 1;">
                    <div class="agent-header" onclick="toggleCard('${agent.id}')">
                        <div class="agent-icon ${agent.iconClass}">
                            <i data-lucide="${agent.icon}" class="w-4 h-4"></i>
                        </div>
                        <div class="agent-info">
                            <div class="agent-title-row">
                                <span class="agent-name">${agent.name}</span>
                                <span class="status-dot ${agent.status}"></span>
                            </div>
                            <div class="agent-preview">${agent.preview}</div>
                        </div>
                        <div class="expand-btn">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="agent-content">
                        <div class="agent-content-inner">
                            <p class="agent-description">${agent.description}</p>
                            ${stepsHtml}
                            ${selectedAgentsHtml}
                            ${agent.timestamp ? `<div class="timestamp">${agent.timestamp}</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAgents() {
            const container = document.getElementById('agentsList');
            container.innerHTML = agents.map((agent, i) => createAgentCard(agent, i)).join('');
            lucide.createIcons();
            updateProgress();
        }

        function toggleCard(id) {
            if (expandedCards.has(id)) {
                expandedCards.delete(id);
            } else {
                expandedCards.add(id);
            }

            const card = document.querySelector(`[data-id="${id}"]`);
            if (card) {
                card.classList.toggle('expanded');
            }
        }

        function expandAll() {
            agents.forEach(agent => expandedCards.add(agent.id));
            document.querySelectorAll('.agent-card').forEach(card => {
                card.classList.add('expanded');
            });
        }

        function collapseAll() {
            expandedCards.clear();
            document.querySelectorAll('.agent-card').forEach(card => {
                card.classList.remove('expanded');
            });
        }

        function toggleAllCards() {
            if (expandedCards.size === agents.length) {
                collapseAll();
            } else {
                expandAll();
            }
        }

        function updateProgress() {
            const completed = agents.filter(a => a.status === 'complete').length;
            const total = agents.filter(a => a.status !== 'queued').length;
            document.getElementById('progressText').textContent = `${completed} of ${total}`;
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if (document.documentElement.classList.contains('dark')) {
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            lucide.createIcons();
        }

        function resetDemo() {
            expandedCards.clear();
            renderAgents();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderAgents();
            // Auto-expand the running card
            setTimeout(() => {
                toggleCard('security');
            }, 800);
        });
    </script>
</body>
</html>
