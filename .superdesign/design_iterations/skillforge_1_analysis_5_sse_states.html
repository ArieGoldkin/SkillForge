<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Progress - SSE States - SkillForge</title>

    <!-- Google Fonts - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ============================================================================
           SKILLFORGE DESIGN SYSTEM
           ============================================================================ */

        :root {
            --background: oklch(0.9911 0 0);
            --foreground: oklch(0.2046 0 0);
            --card: oklch(0.9911 0 0);
            --card-foreground: oklch(0.2046 0 0);
            --muted: oklch(0.9461 0 0);
            --muted-foreground: oklch(0.5 0 0);
            --border: oklch(0.9037 0 0);
            --border-hover: oklch(0.85 0 0);

            --primary: oklch(0.8348 0.1302 160.908);
            --primary-foreground: oklch(0.2626 0.0147 166.4589);

            /* State colors */
            --state-pending: oklch(0.6 0 0);
            --state-pending-bg: oklch(0.95 0 0);
            --state-loading: oklch(0.6231 0.188 259.8145);
            --state-loading-bg: oklch(0.93 0.05 260);
            --state-processing: oklch(0.7686 0.1647 70.0804);
            --state-processing-bg: oklch(0.93 0.05 70);
            --state-accept: oklch(0.6959 0.1491 162.4796);
            --state-accept-bg: oklch(0.93 0.05 160);
            --state-finish: oklch(0.6959 0.1491 162.4796);
            --state-finish-bg: oklch(0.93 0.05 160);
            --state-error: oklch(0.5523 0.1927 32.7272);
            --state-error-bg: oklch(0.93 0.05 30);

            --chart-2: oklch(0.6231 0.188 259.8145);
            --chart-3: oklch(0.6056 0.2189 292.7172);
            --chart-4: oklch(0.7686 0.1647 70.0804);
            --chart-5: oklch(0.6959 0.1491 162.4796);

            --tree-line: oklch(0.88 0 0);
            --font-sans: Outfit, sans-serif;
            --radius: 0.5rem;
            --shadow-sm: 0px 1px 2px 0px hsl(0 0% 0% / 0.05);
            --tracking-normal: 0.025em;
        }

        [data-theme="dark"],
        .dark {
            --background: oklch(0.1822 0 0);
            --foreground: oklch(0.9288 0.0126 255.5078);
            --card: oklch(0.2046 0 0);
            --card-foreground: oklch(0.9288 0.0126 255.5078);
            --muted: oklch(0.2393 0 0);
            --muted-foreground: oklch(0.6 0 0);
            --border: oklch(0.2809 0 0);
            --border-hover: oklch(0.35 0 0);

            --primary: oklch(0.4365 0.1044 156.7556);
            --primary-foreground: oklch(0.9213 0.0135 167.1556);

            --state-pending: oklch(0.5 0 0);
            --state-pending-bg: oklch(0.25 0 0);
            --state-loading: oklch(0.7137 0.1434 254.624);
            --state-loading-bg: oklch(0.25 0.04 260);
            --state-processing: oklch(0.8369 0.1644 84.4286);
            --state-processing-bg: oklch(0.25 0.04 84);
            --state-accept: oklch(0.8003 0.1821 151.711);
            --state-accept-bg: oklch(0.25 0.05 151);
            --state-finish: oklch(0.8003 0.1821 151.711);
            --state-finish-bg: oklch(0.25 0.05 151);
            --state-error: oklch(0.6 0.15 30);
            --state-error-bg: oklch(0.25 0.05 30);

            --chart-2: oklch(0.7137 0.1434 254.624);
            --chart-3: oklch(0.709 0.1592 293.5412);
            --chart-4: oklch(0.8369 0.1644 84.4286);
            --chart-5: oklch(0.7845 0.1325 181.912);

            --tree-line: oklch(0.32 0 0);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans) !important;
            background-color: var(--background) !important;
            color: var(--foreground) !important;
            line-height: 1.5 !important;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            letter-spacing: var(--tracking-normal);
        }

        /* ============================================================================
           ANIMATIONS
           ============================================================================ */

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            from { background-position: -200% 0; }
            to { background-position: 200% 0; }
        }

        @keyframes stateChange {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        .animate-state-change {
            animation: stateChange 0.3s ease-out forwards;
        }

        /* Sequential streaming delays - each item fades in after the previous */
        /* 400ms gap between each sequential item for smooth streaming effect */
        .delay-1 { animation-delay: 0ms; }
        .delay-2 { animation-delay: 400ms; }
        .delay-3 { animation-delay: 800ms; }
        .delay-4 { animation-delay: 1200ms; }
        .delay-5 { animation-delay: 1600ms; }
        .delay-6 { animation-delay: 2000ms; }
        .delay-7 { animation-delay: 2400ms; }
        .delay-8 { animation-delay: 2800ms; }
        .delay-9 { animation-delay: 3200ms; }
        .delay-10 { animation-delay: 3600ms; }

        /* ============================================================================
           LAYOUT
           ============================================================================ */

        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }

        .header-inner {
            max-width: 680px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted-foreground);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .back-link:hover {
            color: var(--foreground);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted-foreground);
            cursor: pointer;
            transition: all 0.15s;
        }

        .icon-btn:hover {
            background: var(--muted);
            color: var(--foreground);
        }

        .main-content {
            flex: 1;
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px 100px;
        }

        .content-header {
            margin-bottom: 24px;
        }

        .content-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .content-subtitle {
            font-size: 13px;
            color: var(--muted-foreground);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--muted);
            border-radius: 100px;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted-foreground);
        }

        .progress-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }

        /* ============================================================================
           TREE STRUCTURE
           ============================================================================ */

        .workflow-tree {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tree-node {
            position: relative;
            margin-bottom: 0;
        }

        .tree-node::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 44px;
            bottom: -8px;
            width: 2px;
            background: var(--tree-line);
            border-radius: 1px;
        }

        .tree-node:last-child::before,
        .tree-node.no-line::before {
            display: none;
        }

        .parallel-group {
            margin-left: 38px;
            margin-top: 8px;
            margin-bottom: 8px;
            position: relative;
        }

        .parallel-group::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--tree-line) 0%, var(--tree-line) 50%, transparent 100%);
        }

        .parallel-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 38px;
            margin-bottom: 8px;
            font-size: 10px;
            font-weight: 600;
            color: var(--muted-foreground);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .parallel-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Parallel label inherits delay from its class */

        .parallel-branch {
            display: flex;
            gap: 12px;
        }

        .parallel-node {
            flex: 1;
            position: relative;
        }

        .parallel-node::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 22px;
            width: 18px;
            height: 2px;
            background: var(--tree-line);
        }

        /* ============================================================================
           AGENT CARD - Matching analysis_2 style
           ============================================================================ */

        .agent-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .agent-card:hover {
            border-color: var(--border-hover);
        }

        .agent-card.finish {
            border-left: 3px solid var(--state-finish);
        }

        .agent-card.loading,
        .agent-card.processing {
            border-left: 3px solid var(--state-processing);
        }

        .agent-card.pending,
        .agent-card.queued {
            opacity: 0.6;
            border-style: dashed;
        }

        .agent-card.pending:hover,
        .agent-card.queued:hover {
            opacity: 0.8;
        }

        .agent-card.error {
            border-left: 3px solid var(--state-error);
        }

        /* Agent Header */
        .agent-header {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .agent-header:hover {
            background: var(--muted);
        }

        .agent-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .agent-icon.extractor { background: oklch(0.93 0.05 260); color: var(--chart-2); }
        .agent-icon.supervisor { background: oklch(0.93 0.05 70); color: var(--chart-4); }
        .agent-icon.tech { background: oklch(0.93 0.06 293); color: var(--chart-3); }
        .agent-icon.security { background: oklch(0.93 0.05 160); color: var(--chart-5); }
        .agent-icon.implementation { background: oklch(0.93 0.06 340); color: oklch(0.6 0.2 340); }
        .agent-icon.quality { background: oklch(0.93 0.05 260); color: var(--chart-2); }
        .agent-icon.synthesis { background: oklch(0.93 0.08 160); color: var(--primary); }

        .dark .agent-icon.extractor,
        [data-theme="dark"] .agent-icon.extractor { background: oklch(0.25 0.04 260); color: var(--chart-2); }
        .dark .agent-icon.supervisor,
        [data-theme="dark"] .agent-icon.supervisor { background: oklch(0.25 0.04 70); color: var(--chart-4); }
        .dark .agent-icon.tech,
        [data-theme="dark"] .agent-icon.tech { background: oklch(0.25 0.05 293); color: var(--chart-3); }
        .dark .agent-icon.security,
        [data-theme="dark"] .agent-icon.security { background: oklch(0.25 0.05 160); color: var(--chart-5); }
        .dark .agent-icon.implementation,
        [data-theme="dark"] .agent-icon.implementation { background: oklch(0.25 0.05 340); color: oklch(0.7 0.15 340); }
        .dark .agent-icon.quality,
        [data-theme="dark"] .agent-icon.quality { background: oklch(0.25 0.04 260); color: var(--chart-2); }
        .dark .agent-icon.synthesis,
        [data-theme="dark"] .agent-icon.synthesis { background: oklch(0.25 0.06 160); }

        .agent-info {
            flex: 1;
            min-width: 0;
        }

        .agent-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .agent-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ============================================================================
           STATE BADGE - The main state indicator from SSE
           ============================================================================ */

        .state-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            transition: all 0.2s;
        }

        .state-badge.pending {
            background: var(--state-pending-bg);
            color: var(--state-pending);
        }

        .state-badge.loading {
            background: var(--state-loading-bg);
            color: var(--state-loading);
        }

        .state-badge.loading svg {
            animation: spin 1s linear infinite;
        }

        .state-badge.processing {
            background: var(--state-processing-bg);
            color: var(--state-processing);
        }

        .state-badge.processing svg {
            animation: spin 1.5s linear infinite;
        }

        .state-badge.accept {
            background: var(--state-accept-bg);
            color: var(--state-accept);
        }

        .state-badge.finish {
            background: var(--state-finish-bg);
            color: var(--state-finish);
        }

        .state-badge.error {
            background: var(--state-error-bg);
            color: var(--state-error);
        }

        .agent-preview {
            font-size: 12px;
            color: var(--muted-foreground);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .streaming-text {
            background: linear-gradient(
                90deg,
                var(--muted-foreground) 0%,
                var(--foreground) 50%,
                var(--muted-foreground) 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2s linear infinite;
        }

        .expand-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: var(--muted-foreground);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .expand-btn svg {
            transition: transform 0.2s ease;
        }

        .agent-card.expanded .expand-btn svg {
            transform: rotate(180deg);
        }

        /* Expanded Content */
        .agent-content {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.25s ease;
        }

        .agent-card.expanded .agent-content {
            max-height: 400px;
            opacity: 1;
        }

        .agent-content-inner {
            padding: 0 14px 14px 62px;
        }

        .agent-description {
            font-size: 13px;
            color: var(--foreground);
            margin-bottom: 12px;
            line-height: 1.6;
        }

        /* Process steps */
        .process-steps {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .process-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted-foreground);
        }

        .process-step .step-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .process-step.complete .step-icon { color: var(--state-finish); }
        .process-step.running .step-icon { color: var(--state-processing); }

        /* Typing dots */
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--state-processing);
            border-radius: 50%;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        .timestamp {
            font-size: 11px;
            color: var(--muted-foreground);
            margin-top: 10px;
        }

        /* Selected agents */
        .selected-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .agent-tag {
            padding: 4px 8px;
            background: var(--muted);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted-foreground);
        }

        /* ============================================================================
           FOOTER
           ============================================================================ */

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--background);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
        }

        .footer-inner {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted-foreground);
            font-family: var(--font-sans);
        }

        .btn:hover {
            border-color: var(--border-hover);
            color: var(--foreground);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-foreground);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-ghost {
            border: none;
            background: transparent;
        }

        .btn-ghost:hover {
            background: var(--muted);
        }

        /* ============================================================================
           RESPONSIVE
           ============================================================================ */

        @media (max-width: 640px) {
            .parallel-branch {
                flex-direction: column;
                gap: 8px;
            }

            .parallel-node::before {
                display: none;
            }

            .agent-content-inner {
                padding-left: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <a href="skillforge_1.html" class="back-link">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back</span>
                </a>
                <div class="header-actions">
                    <button class="icon-btn" onclick="simulateSSE()" title="Simulate SSE">
                        <i data-lucide="play" class="w-4 h-4"></i>
                    </button>
                    <button class="icon-btn" onclick="resetDemo()" title="Reset">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                    <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
                        <i data-lucide="moon" class="w-4 h-4" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header animate-fade-in-up delay-1">
                <h1 class="content-title">React Server Components</h1>
                <div class="content-subtitle">
                    <span>Analyzing documentation...</span>
                    <span class="progress-pill">
                        <span class="dot"></span>
                        <span id="progressText">3 of 6</span>
                    </span>
                </div>
            </div>

            <div class="workflow-tree" id="workflowTree">
                <!-- Tree nodes will be inserted here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-inner">
                <button class="btn btn-ghost" onclick="resetDemo()">
                    Reset
                </button>
                <button class="btn" onclick="simulateSSE()">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    Simulate SSE
                </button>
                <button class="btn btn-primary" onclick="skipToEnd()">
                    Complete All
                </button>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // SSE States - exactly what comes from backend
        const SSE_STATES = {
            PENDING: 'pending',
            LOADING: 'loading',
            PROCESSING: 'processing',
            ACCEPT: 'accept',
            FINISH: 'finish',
            ERROR: 'error'
        };

        // State display config
        const STATE_CONFIG = {
            pending: { icon: 'circle', label: 'Pending' },
            loading: { icon: 'loader-2', label: 'Loading' },
            processing: { icon: 'loader-2', label: 'Processing' },
            accept: { icon: 'check-circle', label: 'Accept' },
            finish: { icon: 'check', label: 'Done' },
            error: { icon: 'x-circle', label: 'Error' }
        };

        // Workflow data with current SSE state
        const workflowTree = {
            nodes: [
                {
                    id: 'extractor',
                    name: 'Content Extractor',
                    icon: 'file-search',
                    iconClass: 'extractor',
                    preview: 'Extracted 2,500 words from article',
                    description: 'Successfully fetched and parsed content from the provided URL.',
                    state: 'finish', // Current SSE state
                    steps: [
                        { text: 'Extracted 2,500 words', status: 'complete' },
                        { text: 'Detected technical documentation', status: 'complete' },
                        { text: 'Found 8 code snippets', status: 'complete' }
                    ],
                    timestamp: '12:34:08'
                },
                {
                    id: 'supervisor',
                    name: 'Supervisor',
                    icon: 'network',
                    iconClass: 'supervisor',
                    preview: 'Assigned 4 specialist agents',
                    description: 'Analyzed content type and complexity to determine optimal agent routing.',
                    state: 'finish',
                    selectedAgents: ['Tech Comparator', 'Security Auditor', 'Implementation Planner', 'Code Quality'],
                    timestamp: '12:34:12'
                },
                {
                    type: 'parallel',
                    nodes: [
                        {
                            id: 'tech',
                            name: 'Tech Comparator',
                            icon: 'git-compare',
                            iconClass: 'tech',
                            preview: 'Compared with 3 alternatives',
                            description: 'Analyzed React Server Components against alternative approaches.',
                            state: 'finish',
                            steps: [
                                { text: 'RSC vs Traditional SSR', status: 'complete' },
                                { text: 'Found 3 migration patterns', status: 'complete' },
                                { text: 'Performance trade-offs documented', status: 'complete' }
                            ],
                            timestamp: '12:34:22'
                        },
                        {
                            id: 'security',
                            name: 'Security Auditor',
                            icon: 'shield',
                            iconClass: 'security',
                            preview: 'Scanning security patterns...',
                            description: 'Analyzing code for potential security vulnerabilities and best practices.',
                            state: 'processing', // Currently processing
                            steps: [
                                { text: 'Authentication patterns', status: 'complete' },
                                { text: 'CORS configuration', status: 'running' },
                                { text: 'Input sanitization', status: 'pending' }
                            ],
                            timestamp: null
                        }
                    ]
                },
                {
                    type: 'parallel',
                    nodes: [
                        {
                            id: 'implementation',
                            name: 'Implementation Planner',
                            icon: 'list-checks',
                            iconClass: 'implementation',
                            preview: 'Waiting...',
                            description: 'Will create step-by-step implementation guide.',
                            state: 'pending',
                            steps: [],
                            timestamp: null
                        },
                        {
                            id: 'quality',
                            name: 'Code Quality',
                            icon: 'badge-check',
                            iconClass: 'quality',
                            preview: 'Waiting...',
                            description: 'Will review code quality and suggest improvements.',
                            state: 'pending',
                            steps: [],
                            timestamp: null
                        }
                    ]
                },
                {
                    id: 'synthesis',
                    name: 'Result Synthesis',
                    icon: 'sparkles',
                    iconClass: 'synthesis',
                    preview: 'Waiting for all agents...',
                    description: 'Will combine all agent outputs into a comprehensive learning guide.',
                    state: 'pending',
                    steps: [],
                    timestamp: null
                }
            ]
        };

        let expandedCards = new Set();

        function createStateBadge(state) {
            const config = STATE_CONFIG[state];
            const needsSpinner = state === 'loading' || state === 'processing';

            return `
                <span class="state-badge ${state} animate-state-change">
                    <i data-lucide="${config.icon}" class="w-3 h-3"></i>
                    ${config.label}
                </span>
            `;
        }

        function createAgentCard(agent, index) {
            const isExpanded = expandedCards.has(agent.id);
            const isActive = agent.state === 'loading' || agent.state === 'processing';

            let stepsHtml = '';
            if (agent.steps && agent.steps.length > 0) {
                stepsHtml = `
                    <div class="process-steps">
                        ${agent.steps.map(step => `
                            <div class="process-step ${step.status}">
                                <span class="step-icon">
                                    ${step.status === 'complete' ? '<i data-lucide="check" class="w-3 h-3"></i>' :
                                      step.status === 'running' ? '<i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i>' :
                                      '<i data-lucide="circle" class="w-3 h-3"></i>'}
                                </span>
                                <span>${step.text}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            if (isActive) {
                stepsHtml += `
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
            }

            let selectedAgentsHtml = '';
            if (agent.selectedAgents) {
                selectedAgentsHtml = `
                    <div class="selected-agents">
                        ${agent.selectedAgents.map(a => `<span class="agent-tag">${a}</span>`).join('')}
                    </div>
                `;
            }

            const previewClass = isActive ? 'streaming-text' : '';

            return `
                <div class="agent-card ${agent.state} ${isExpanded ? 'expanded' : ''} animate-fade-in-up delay-${index + 1}"
                     data-id="${agent.id}">
                    <div class="agent-header" onclick="toggleCard('${agent.id}')">
                        <div class="agent-icon ${agent.iconClass}">
                            <i data-lucide="${agent.icon}" class="w-4 h-4"></i>
                        </div>
                        <div class="agent-info">
                            <div class="agent-title-row">
                                <span class="agent-name">${agent.name}</span>
                                ${createStateBadge(agent.state)}
                            </div>
                            <div class="agent-preview ${previewClass}">${agent.preview}</div>
                        </div>
                        <div class="expand-btn">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="agent-content">
                        <div class="agent-content-inner">
                            <p class="agent-description">${agent.description}</p>
                            ${stepsHtml}
                            ${selectedAgentsHtml}
                            ${agent.timestamp ? `<div class="timestamp">${agent.timestamp}</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWorkflow() {
            const container = document.getElementById('workflowTree');
            let html = '';
            let delayStep = 1; // Tracks the sequential delay step

            workflowTree.nodes.forEach((item, nodeIndex) => {
                if (item.type === 'parallel') {
                    // Parallel group: label fades in first, then both items fade in together
                    const labelDelay = delayStep;
                    const itemsDelay = delayStep + 1;

                    html += `
                        <div class="tree-node no-line">
                            <div class="parallel-label delay-${labelDelay}">
                                <i data-lucide="git-branch" class="w-3 h-3"></i>
                                Parallel
                            </div>
                            <div class="parallel-group">
                                <div class="parallel-branch">
                                    ${item.nodes.map((agent) => `
                                        <div class="parallel-node">
                                            ${createAgentCard(agent, itemsDelay)}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    delayStep += 2; // Move past this parallel group
                } else {
                    const isLast = nodeIndex === workflowTree.nodes.length - 1;
                    html += `
                        <div class="tree-node ${isLast ? 'no-line' : ''}">
                            ${createAgentCard(item, delayStep)}
                        </div>
                    `;
                    delayStep++;
                }
            });

            container.innerHTML = html;
            lucide.createIcons();
            updateProgress();
        }

        function toggleCard(id) {
            if (expandedCards.has(id)) {
                expandedCards.delete(id);
            } else {
                expandedCards.add(id);
            }
            const card = document.querySelector(`[data-id="${id}"]`);
            if (card) card.classList.toggle('expanded');
        }

        function getAllAgents() {
            const agents = [];
            workflowTree.nodes.forEach(item => {
                if (item.type === 'parallel') {
                    agents.push(...item.nodes);
                } else {
                    agents.push(item);
                }
            });
            return agents;
        }

        function updateProgress() {
            const agents = getAllAgents();
            const completed = agents.filter(a => a.state === 'finish').length;
            document.getElementById('progressText').textContent = `${completed} of ${agents.length}`;
        }

        // Simulate SSE state changes
        let sseSimulationStep = 0;
        const sseSequence = [
            { id: 'security', state: 'accept', preview: 'Validating results...' },
            { id: 'security', state: 'finish', preview: '3 recommendations found', steps: [
                { text: 'Authentication patterns', status: 'complete' },
                { text: 'CORS configuration', status: 'complete' },
                { text: 'Input sanitization', status: 'complete' }
            ]},
            { id: 'implementation', state: 'loading', preview: 'Loading context...' },
            { id: 'quality', state: 'loading', preview: 'Loading context...' },
            { id: 'implementation', state: 'processing', preview: 'Creating guide...' },
            { id: 'quality', state: 'processing', preview: 'Analyzing patterns...' },
            { id: 'implementation', state: 'finish', preview: '12 implementation steps' },
            { id: 'quality', state: 'finish', preview: '5 suggestions' },
            { id: 'synthesis', state: 'loading', preview: 'Loading results...' },
            { id: 'synthesis', state: 'processing', preview: 'Combining outputs...' },
            { id: 'synthesis', state: 'finish', preview: 'Guide ready!' }
        ];

        function simulateSSE() {
            if (sseSimulationStep >= sseSequence.length) {
                sseSimulationStep = 0;
                return;
            }

            const event = sseSequence[sseSimulationStep];
            const agent = getAllAgents().find(a => a.id === event.id);

            if (agent) {
                agent.state = event.state;
                agent.preview = event.preview;
                if (event.steps) agent.steps = event.steps;
                if (event.state === 'finish') {
                    agent.timestamp = new Date().toLocaleTimeString('en-US', {
                        hour12: false,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                }
            }

            renderWorkflow();

            // Keep expanded cards expanded
            expandedCards.forEach(id => {
                const card = document.querySelector(`[data-id="${id}"]`);
                if (card) card.classList.add('expanded');
            });

            sseSimulationStep++;
        }

        function resetDemo() {
            sseSimulationStep = 0;

            // Reset all agents to initial state
            const agents = getAllAgents();
            agents.forEach(agent => {
                if (agent.id === 'extractor' || agent.id === 'supervisor' || agent.id === 'tech') {
                    agent.state = 'finish';
                } else if (agent.id === 'security') {
                    agent.state = 'processing';
                    agent.preview = 'Scanning security patterns...';
                    agent.steps = [
                        { text: 'Authentication patterns', status: 'complete' },
                        { text: 'CORS configuration', status: 'running' },
                        { text: 'Input sanitization', status: 'pending' }
                    ];
                    agent.timestamp = null;
                } else {
                    agent.state = 'pending';
                    agent.preview = 'Waiting...';
                    agent.timestamp = null;
                }
            });

            expandedCards.clear();
            renderWorkflow();

            // Auto-expand security
            setTimeout(() => toggleCard('security'), 500);
        }

        function skipToEnd() {
            getAllAgents().forEach(agent => {
                agent.state = 'finish';
                agent.preview = agent.preview.replace('Waiting...', 'Complete');
                agent.preview = agent.preview.replace('Scanning security patterns...', '3 recommendations');
                agent.preview = agent.preview.replace('Waiting for all agents...', 'Guide ready!');
                if (agent.steps) {
                    agent.steps.forEach(s => s.status = 'complete');
                }
                agent.timestamp = agent.timestamp || '12:35:00';
            });
            sseSimulationStep = sseSequence.length;
            renderWorkflow();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark' || html.classList.contains('dark');

            if (isDark) {
                html.removeAttribute('data-theme');
                html.classList.remove('dark');
            } else {
                html.setAttribute('data-theme', 'dark');
                html.classList.add('dark');
            }

            const icon = document.getElementById('themeIcon');
            icon.setAttribute('data-lucide', isDark ? 'moon' : 'sun');
            lucide.createIcons();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderWorkflow();
            setTimeout(() => toggleCard('security'), 600);
        });
    </script>
</body>
</html>
