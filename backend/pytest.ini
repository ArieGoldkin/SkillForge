[pytest]
# Pytest configuration file
# Timeout configuration for pytest-timeout plugin
# Default timeout: 5 minutes (300 seconds) for all tests
# Individual tests can override with @pytest.mark.timeout(seconds)
timeout = 300
timeout_method = thread

# Asyncio mode: auto allows mixing sync and async fixtures/tests
asyncio_mode = auto

# Suppress Python 3.13 AsyncMock RuntimeWarning (harmless - coroutines created during __init__)
filterwarnings =
    ignore::RuntimeWarning

# Register custom markers to avoid warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    external: marks tests that require external services (OpenAI, Jina, etc.)
    timeout: marks tests with specific timeout values (pytest-timeout plugin)
