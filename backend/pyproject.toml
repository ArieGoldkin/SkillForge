[tool.poetry]
name = "skillforge-backend"
version = "0.1.0"
description = "SkillForge Backend API - Research-to-Implementation Pipeline"
authors = ["SkillForge Team"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.121.2"
starlette = "^0.50.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
pydantic = "^2.10.3"
pydantic-settings = "^2.12.0"
python-dotenv = "^1.0.1"
structlog = "^25.5.0"
httpx = "^0.28.1"
sse-starlette = "^3.0.3"
tenacity = "^9.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
psycopg2-binary = "^2.9.10"
pgvector = "^0.4.1"
asyncpg = "^0.31.0"
langgraph = "^1.0.4"
langchain = "^1.1.0"
langchain-core = "^1.1.0"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.0"
langchain-anthropic = "^1.2.0"
langchain-google-genai = "^3.2.0"
langgraph-checkpoint = "^3.0.1"
alembic = "^1.17.2"
tiktoken = "^0.12.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
ruff = "^0.14.6"
mypy = "^1.13.0"
isort = "^7.0.0"
langgraph-cli = {extras = ["inmem"], version = "^0.2.0"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (Python syntax upgrades)
    "B",      # flake8-bugbear (security and performance)
    "SIM",    # flake8-simplify (simplification)
    "C4",     # flake8-comprehensions (comprehension checks)
    "TID",    # flake8-tidy-imports (import conventions)
    "PTH",    # flake8-use-pathlib (pathlib usage)
    "TD",     # flake8-todos (TODO comments)
    "D",      # pydocstyle (docstring style)
    "PL",     # Pylint (error checking)
    "TRY",    # tryceratops (exception handling)
    "EM",     # flake8-errmsg (exception messages)
    "BLE",    # flake8-blind-except (blind exceptions)
    "FAST",   # FastAPI-specific rules
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line summary should start at second line (conflicts with D212)
    # Overly pedantic rules for production code:
    "PLC0415",  # Import at non-top-level (valid for TYPE_CHECKING, lazy imports)
    "TRY301",   # Abstract raise to inner function (overly pedantic)
    "SIM105",   # Use contextlib.suppress (try/except is clearer)
    "SIM117",   # Combine with statements (readability preference)
    "TRY300",   # Consider moving to else block (stylistic)
    "RUF043",   # Pairwise instead of zip (Python 3.10+ feature, stylistic)
]

[tool.ruff.lint.per-file-ignores]
# Allow magic values, simpler assertions, and cleanup patterns in tests
"tests/**/*.py" = [
    "PLR2004",  # Magic value in comparison - common in test assertions
    "PLR0913",  # Too many arguments - common in test functions with many mocks
    "PLR0915",  # Too many statements - e2e tests can be long
    "D100",     # Missing module docstring
    "D103",     # Missing function docstring
    "D104",     # Missing package docstring
    "BLE001",   # Blind exception - acceptable in test cleanup/teardown
    "EM101",    # Exception string literal - acceptable in test mocks
    "F841",     # Unused variable - test fixtures may define for documentation
]

[tool.ruff.format]
# Ruff formatter configuration (replaces Black)
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
# Performance optimizations
incremental = true
cache_dir = ".mypy_cache"
show_error_codes = true
# Exclude test files and unnecessary directories for faster checks
exclude = [
    "tests/",
    "alembic/",
    "scripts/",
    ".*/__pycache__/",
    ".*\\.pyc$",
]
# Optimize import checking (follows imports but doesn't check their bodies if not needed)
follow_imports = "normal"
follow_imports_for_stubs = false
[[tool.mypy.overrides]]
module = "langgraph.checkpoint.postgres"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "openai",
    "langchain.*",
    "sse_starlette.*",
    "tiktoken",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Parallel execution: auto-detect CPU cores, use worksteal distribution
# Use -n 1 to disable parallel (for debugging)
# Use -m "" to run all tests including slow/external
addopts = "-n auto --dist worksteal -m 'not slow and not external'"
# Markers for test categorization
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "external: marks tests that require external services (OpenAI, Jina, etc.)",
    "timeout: marks tests with specific timeout values (pytest-timeout plugin)",
]
# Filter out warnings from third-party libraries that we cannot control
filterwarnings = [
    # LangSmith serialization tries to serialize AsyncMock objects during tracing
    # This is a known issue when mocking async functions in tests - suppress all such warnings
    "ignore:coroutine.*was never awaited:RuntimeWarning",
    # Suppress pytest's unraisable exception wrapper for the same issue
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
