[tool.poetry]
name = "skillforge-backend"
version = "0.1.0"
description = "SkillForge Backend API - Research-to-Implementation Pipeline"
license = "BUSL-1.1"
authors = ["SkillForge Team"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.127.0"
starlette = "^0.50.0"
uvicorn = {version = "^0.40.0", extras = ["standard"]}
pydantic = "^2.10.3"
pydantic-settings = "^2.12.0"
python-dotenv = "^1.0.1"
structlog = "^25.5.0"
httpx = "^0.28.1"
sse-starlette = "^3.0.3"
tenacity = "^9.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
psycopg2-binary = "^2.9.10"
pgvector = "^0.4.2"
asyncpg = "^0.31.0"
langgraph = "^1.0.4"
langchain = "^1.1.2"
langchain-core = "^1.2.4"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.6"
langchain-anthropic = "^1.3.0"
langchain-google-genai = "^4.1.2"
langchain-redis = {version = "^0.2.5", python = ">=3.13,<3.14"}
langgraph-checkpoint = "^3.0.1"
# MCP Integration (Sprint 9) - Issue #230
langchain-mcp-adapters = "^0.2.1"
mcp = "^1.25.0"
alembic = "^1.17.2"
tiktoken = "^0.12.0"
jinja2 = "^3.1.0"
# PDF extraction for research papers (Issue #299-304)
pypdf = "^6.5.0"
# Langfuse observability (replaces LangSmith - Issue #372)
langfuse = "3.11.1"
orjson = "^3.11.5"
# Rate limiting middleware
slowapi = "^0.1.9"
langgraph-checkpoint-redis = {version = ">=0.3.1", python = ">=3.13,<3.14"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
ruff = "^0.14.10"
ty = "^0.0.5"
isort = "^7.0.0"
# langgraph-cli is installed separately via pip due to dependency conflict:
# langgraph-cli requires sse-starlette <2.2.0, but we use sse-starlette ^3.0.3
# Install with: poetry run pip install "langgraph-cli[inmem]"
# Note: This will downgrade sse-starlette temporarily - use separate venv for Studio debugging
jsonschema = "^4.25.1"
playwright = "^1.57.0"
pytest-vcr = "^1.0.2"
vcrpy = "^8.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    # Core quality checks (existing)
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (Python syntax upgrades)
    "B",      # flake8-bugbear (security and performance)
    "SIM",    # flake8-simplify (simplification)
    "C4",     # flake8-comprehensions (comprehension checks)
    "TID",    # flake8-tidy-imports (import conventions)
    "PTH",    # flake8-use-pathlib (pathlib usage)
    "TD",     # flake8-todos (TODO comments)
    "D",      # pydocstyle (docstring style)
    "PL",     # Pylint (error checking)
    "TRY",    # tryceratops (exception handling)
    "EM",     # flake8-errmsg (exception messages)
    "BLE",    # flake8-blind-except (blind exceptions)
    "FAST",   # FastAPI-specific rules
    "RUF",    # Ruff-specific rules
    
    # NEW - CRITICAL QUALITY CHECKS (2025 modernization)
    "S",      # flake8-bandit (security) - catches SQL injection, hardcoded secrets, etc.
    "ASYNC",  # flake8-async - async/await correctness
    "PERF",   # Perflint - performance anti-patterns
    "LOG",    # flake8-logging - structured logging best practices
    "DTZ",    # flake8-datetimez - timezone-aware datetime usage
    "TC",     # flake8-type-checking - optimize TYPE_CHECKING imports
    "T20",    # flake8-print - ban print() in production code
    
    # NEW - MEDIUM PRIORITY QUALITY CHECKS
    "G",      # flake8-logging-format - logging argument formatting
    "ARG",    # flake8-unused-arguments - detect dead parameters
    "RET",    # flake8-return - simplify return statements
    "PIE",    # flake8-pie - miscellaneous code improvements
    "ERA",    # eradicate - find commented-out code
    "FURB",   # refurb - Python modernization patterns
    "FBT003", # boolean-positional-value-in-call only (not FBT001/FBT002)
]
ignore = [
    # Line length and docstring conflicts (existing)
    "E501",   # Line too long (handled by formatter)
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line summary should start at second line (conflicts with D212)
    
    # Overly pedantic rules for production code (existing)
    "PLC0415",  # Import at non-top-level (valid for TYPE_CHECKING, lazy imports)
    "TRY301",   # Abstract raise to inner function (overly pedantic)
    "SIM105",   # Use contextlib.suppress (try/except is clearer)
    "SIM117",   # Combine with statements (readability preference)
    "TRY300",   # Consider moving to else block (stylistic)
    
    # NEW - Appropriate ignores for new rules
    "G201",   # logger.error(exc_info=True) OK with structlog (instead of logger.exception)
    "S311",   # Non-cryptographic random OK for UUIDs/testing
    "G004",   # f-strings OK with structlog (structured logging)
    "FBT001", # Boolean positional args OK internally (not public API)
    "FBT002", # Boolean default values OK internally (not public API)
]

[tool.ruff.lint.per-file-ignores]
# Allow magic values, simpler assertions, and cleanup patterns in tests
"tests/**/*.py" = [
    "PLR2004",  # Magic value in comparison - common in test assertions
    "PLR0913",  # Too many arguments - common in test functions with many mocks
    "PLR0915",  # Too many statements - e2e tests can be long
    "D100",     # Missing module docstring
    "D101",     # Missing class docstring - test class names are self-descriptive
    "D102",     # Missing method docstring - test method names are self-descriptive
    "D103",     # Missing function docstring
    "D104",     # Missing package docstring
    "BLE001",   # Blind exception - acceptable in test cleanup/teardown
    "EM101",    # Exception string literal - acceptable in test mocks
    "F841",     # Unused variable - test fixtures may define for documentation
    "TRY003",   # Long exception message - acceptable in test error scenarios
    # NEW - Test-specific ignores for new rules
    "S101",     # assert OK in tests (required for pytest)
    "ARG001",   # Unused function args OK (pytest fixtures used for side effects)
    "ARG002",   # Unused method args OK (pytest fixtures in test classes)
    "ARG005",   # Unused lambda args OK (mock callbacks with unused params)
    "ERA001",   # Explanatory comments with = signs look like code but aren't
    "T201",     # print() OK in tests for debugging
    "S311",     # Non-crypto random OK in tests
    "S105",     # Hardcoded passwords OK in test credentials
    "S106",     # Hardcoded password in function args OK in tests
    "S108",     # Hardcoded temp paths OK in tests
    "S110",     # try-except-pass OK in test cleanup/error handling tests
    "S104",     # Binding to 0.0.0.0 OK in test fixtures
    "S603",     # subprocess without shell OK in test runners
    "S608",     # SQL string construction OK in validation tests
]
# Diagnostic scripts can have more complex error handling
"scripts/**/*.py" = [
    "PLR0915",  # Too many statements - diagnostic scripts can be long
    "BLE001",   # Blind exception catching - diagnostic scripts need broad error handling
    "PLR2004",  # Magic values - common in CLI argument parsing
    "D401",     # Imperative mood - acceptable for main() functions
    # NEW - Script-specific ignores
    "T201",     # print() OK in CLI scripts
    "DTZ005",   # datetime.now() without tz OK for local timestamps
]
# Alembic migration files have specific format requirements
"alembic/versions/**/*.py" = [
    "D103",     # Missing function docstring - alembic upgrade/downgrade don't need docstrings
    "D400",     # First line ending - alembic format doesn't require period
    "D415",     # First line punctuation - alembic format is specific
]
# Complex aggregation function legitimately needs many statements
"app/workflows/tasks/aggregate_findings.py" = [
    "PLR0915",  # Too many statements - complex aggregation logic with multiple steps
]
# Schema files use numeric constraints for validation - magic numbers are intentional
"app/workflows/tasks/schemas/*.py" = [
    "PLR2004",  # Magic values - field validators use numeric constraints (3-7 items, etc.)
]
# Result<T, E> type system - UP047 type parameter syntax would complicate the API unnecessarily
"app/shared/types/result_types.py" = [
    "UP047",  # Generic function should use type parameters - conflicts with clean API design
    "D102",   # Missing method docstring - type utilities prioritize clean API over verbose docs
    "D105",   # Missing magic method docstring - __repr__ is self-documenting
    "TC003",  # Callable import needed at runtime for Result type system
    "ARG002", # Monad interface requires parameters even if unused in Err case
]
# Evaluation framework - experimental benchmarking code with complex logic
"app/evaluation/**/*.py" = [
    "PLR0912",  # Too many branches - evaluator logic requires multiple checks
    "PLR0913",  # Too many arguments - benchmark config needs many params
    "PLR0915",  # Too many statements - complex evaluation logic
    "PLR2004",  # Magic values - common in evaluation thresholds
    "TD002",    # TODO author - internal development code
    "TD003",    # TODO issue link - internal development code
    "BLE001",   # Blind exception - acceptable in experiment error handling
    "TRY003",   # Long exception msg - acceptable for clear error context
    "TRY400",   # logging.exception - using structured logging
    "EM102",    # f-string in exception - acceptable for context
    "PTH123",   # Path.open() - json.load compatibility
    "C401",     # set comprehension - readability preference
    "D401",     # Imperative mood - acceptable for main() functions
    "D413",     # Missing blank line after last section - conflicts with ruff formatter
    "D417",     # Missing argument description - optional param docs
    "RUF022",   # __all__ sorting - organized by category intentionally
    "RUF100",   # Unused noqa - keep for clarity
    "SIM108",   # Ternary operator - readability preference
    "F841",     # Unused variable - valid for future use patterns
    # NEW - Evaluation-specific ignores
    "T201",     # print() OK in benchmark/evaluation scripts
    "DTZ005",   # datetime.now() without tz OK for benchmark timestamps
]
# API endpoints - request parameter required by FastAPI but not always used
"app/api/v1/**/sse_handler.py" = [
    "ARG001",  # Request parameter required by FastAPI for SSE endpoints
]
"app/api/v1/tutor/streaming.py" = [
    "ARG001",  # Request parameter required by FastAPI for SSE endpoints
]
# Agent tools - content parameter required by LangChain tool schema
"app/domains/analysis/workflows/nodes/agent_tools.py" = [
    "ARG001",  # Tool parameters required by LangChain schema even if unused
]
# Agent factories - system_prompt for future LCEL fallback implementation
"app/domains/analysis/workflows/agents/factories.py" = [
    "ARG001",  # system_prompt reserved for future LCEL fallback
]
# Annotation service - metadata for future annotation features
"app/core/annotation_service.py" = [
    "ARG002",  # metadata reserved for future annotation features
    "S101",    # assert used as type guard after validation
]
# Tracing module - intentional silent failures for optional Langfuse
"app/core/tracing.py" = [
    "S110",    # Silent pass OK - Langfuse is optional, failures are acceptable
]
# Workflow tasks - intentional silent failures for optional Langfuse
"app/domains/analysis/workflows/tasks/*.py" = [
    "S110",    # Silent pass OK - Langfuse tracing is optional
]
"app/domains/analysis/workflows/nodes/supervisor.py" = [
    "S110",    # Silent pass OK - Langfuse tracing is optional
]
# Supervisor config - S608 false positive (LLM prompt, not SQL)
"app/domains/analysis/workflows/nodes/supervisor_config.py" = [
    "S608",    # False positive - f-string is LLM prompt, not SQL
]
# Config validation - S104 false positive (validating AGAINST 0.0.0.0)
"app/core/config.py" = [
    "S104",    # False positive - validating that HOST is NOT 0.0.0.0
]
# Evaluation thresholds - S105 false positive (enum values, not passwords)
"app/evaluation/pipeline/thresholds.py" = [
    "S105",    # False positive - "pass"/"fail" are enum values, not passwords
]
# PII types - S105 false positive (enum values, not passwords)
"app/shared/services/pii/types.py" = [
    "S105",    # False positive - "github_token" is enum value, not password
]
# Embedding service - S101 used as type guard
"app/shared/services/embeddings/service.py" = [
    "S101",    # assert used as type guard after validation
]
# Cost tracker - S101 used as type guard for singleton
"app/shared/services/g_eval/cost_tracker.py" = [
    "S101",    # assert used as type guard for singleton pattern
]
# ArXiv extractor - S110 intentional best-effort parsing
"app/shared/services/extraction/arxiv_pdf_extractor.py" = [
    "S110",    # Silent pass OK - best-effort title extraction
]
# Context scope - ARG001 agent_type reserved for future feature
"app/shared/workflows/context_scope.py" = [
    "ARG001",  # agent_type reserved for future agent-specific summarization
]

[tool.ruff.format]
# Ruff formatter configuration (replaces Black)
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ty]
# ty type checker configuration (Astral's Rust-based type checker)
# https://pypi.org/project/ty/

# Python version for analysis (inferred from project.requires-python by default)
[tool.ty.environment]
python-version = "3.13"  # Explicitly set to match project requirement

# Source file inclusion/exclusion (replaces CLI --exclude flag)
[tool.ty.src]
exclude = ["app/evaluation/*"]  # Move CLI exclusion to config

# Rule severity levels (error, warn, ignore)
[tool.ty.rules]
# Critical type errors - always error
possibly-unresolved-reference = "error"
invalid-argument-type = "error"
missing-argument = "error"
unsupported-operator = "error"
division-by-zero = "error"

# Code quality - warn to encourage fixes without blocking
unused-ignore-comment = "warn"  # Detect dead # ty: ignore comments
redundant-cast = "warn"  # Detect unnecessary type casts

# Terminal output configuration
[tool.ty.terminal]
output-format = "concise"  # Cleaner output (new in 0.0.5: limited import paths)
error-on-warning = false  # Don't fail CI on warnings (only errors)

# Per-directory rule overrides
# Relaxed rules for evaluation code (experimental/benchmarking)
[[tool.ty.overrides]]
include = ["app/evaluation/**"]

[tool.ty.overrides.rules]
# Evaluation code has complex type interactions - be lenient
possibly-unresolved-reference = "warn"
invalid-argument-type = "warn"

# Tests can have more relaxed rules
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py"]

[tool.ty.overrides.rules]
# Test code may use mocks/fixtures that aren't fully typed
possibly-unresolved-reference = "warn"
missing-argument = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Parallel execution: auto-detect CPU cores, use worksteal distribution
# Use -n 1 to disable parallel (for debugging)
# Use -m "" to run all tests including slow/external
addopts = "-n auto --dist worksteal -m 'not slow and not external'"
# Markers for test categorization
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "external: marks tests that require external services (OpenAI, Jina, etc.)",
    "timeout: marks tests with specific timeout values (pytest-timeout plugin)",
    "smoke: marks tests as smoke tests (quick validation of critical functionality)",
    "retrieval: marks tests for retrieval/search functionality",
    "semantic: marks semantic search tests (vector similarity)",
    "keyword: marks keyword search tests (full-text search)",
    "hybrid: marks hybrid search tests (combined semantic + keyword)",
]
# Filter out warnings from third-party libraries that we cannot control
filterwarnings = [
    # Python 3.13 AsyncMock creates coroutines during __init__ that may not be awaited
    # This is harmless - AsyncMock._execute_mock_call creates a coroutine during initialization
    # Suppress all RuntimeWarnings from unittest.mock module (where AsyncMock is defined)
    "ignore::RuntimeWarning",
    # Suppress pytest's unraisable exception wrapper for the same issue
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
# Measure code coverage but omit experimental, CLI scripts, and unused modules
omit = [
    # Note: app/workflows/nodes/agent_tools.py removed - now has full tests (issue #289)
    "app/workflows/studio_compat.py",  # LangGraph Studio compatibility placeholder
    "app/workflows/tutor/tasks/*",     # Tutor task placeholders
    "app/workflows/tutor/context.py",  # Tutor context placeholder
    # Dead code - not imported anywhere (verified Dec 2024)
    "app/shared/services/quality_scorer.py",      # Unused legacy scorer
    "app/shared/services/search/coarse_to_fine.py",  # Unused search strategy
    # CLI scripts - not unit-testable, tested via integration/smoke tests
    "app/evaluation/generate_config.py",   # CLI config generator
    "app/evaluation/llm_benchmark.py",     # Benchmark runner CLI
    "app/evaluation/run_experiments.py",   # Experiment runner CLI
    # Tier 3 Research Agents - LLM-heavy runners, tested via integration/E2E (Issue #501)
    "app/domains/analysis/workflows/agents/deep_researcher.py",
    "app/domains/analysis/workflows/agents/community_pulse.py",
    "app/domains/analysis/workflows/agents/knowledge_curator.py",
    "app/domains/analysis/workflows/agents/learning_path_advisor.py",
    "app/domains/analysis/workflows/agents/learning_path.py",  # Unused legacy schema
    "app/domains/analysis/workflows/nodes/agents/deep_researcher_node.py",
    "app/domains/analysis/workflows/nodes/agents/community_pulse_node.py",
    "app/domains/analysis/workflows/nodes/agents/knowledge_curator_node.py",
    "app/domains/analysis/workflows/nodes/agents/learning_path_advisor_node.py",
]

[tool.coverage.report]
# Exclude patterns from coverage reporting
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
