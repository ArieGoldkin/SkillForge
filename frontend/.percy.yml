version: 2

# Percy Configuration for SkillForge Frontend Visual Regression Testing
# Documentation: https://www.browserstack.com/docs/percy/get-started/overview

snapshot:
  # Viewport widths for responsive testing
  widths:
    - 375  # Mobile (iPhone SE/12/13)
    - 1280 # Desktop (MacBook Pro, standard laptop)

  # Minimum height to capture common viewport sizes
  min-height: 1024

  # Percy CSS to hide dynamic elements that change between builds
  percy-css: |
    /* Hide timestamps and dynamic time-based elements */
    [data-testid="timestamp"],
    time,
    .timestamp {
      visibility: hidden !important;
    }

    /* Disable animations to prevent flakiness */
    [data-testid="loading-spinner"],
    .loading-indicator {
      animation: none !important;
    }

  # Enable JavaScript for dynamic content rendering
  enable-javascript: true

# Discovery settings
discovery:
  # Disable cache for fresh snapshots
  disable-cache: false

  # Allow network requests for local development
  allowed-hostnames:
    - localhost
    - 127.0.0.1

  # Network idle timeout for ensuring pages are fully loaded
  network-idle-timeout: 750

# Agent configuration
agent:
  # Asset discovery timeout
  asset-discovery:
    network-idle-timeout: 1250
