name: skillforge

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: skillforge-postgres-dev
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: skillforge
    ports:
      - "5437:5432"  # Using 5437 to avoid conflicts with reporter-accuracy (5433, 5436)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: skillforge-redis-dev
    ports:
      - "6380:6379"  # Using 6380 to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-dev-data:/data
    command: redis-server --appendonly yes --tcp-keepalive 300

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: skillforge-backend-dev
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://dev:devpass@postgres:5432/skillforge
      API_V1_PREFIX: /api/v1
      HOST: 0.0.0.0
      PORT: 8500
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5175"]'
      REDIS_URL: redis://redis:6379
      # Note: DATABASE_URL is overridden above for container-internal connection
      # All other variables (API keys, LLM_MODEL, JINA_API_KEY, etc.) are loaded from ./backend/.env via env_file
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Mount code for hot reload (development)
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -U dev -d postgres; do sleep 2; done &&
        echo 'Running migrations...' &&
        /app/.venv/bin/alembic upgrade head &&
        echo 'Starting backend...' &&
        /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8500 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: skillforge-frontend-dev
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:8500
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # LANGFUSE v3 OBSERVABILITY STACK (Self-Hosted - FREE)
  # =============================================================================
  # Replaces LangSmith cloud with local observability.
  # All services are open source and run locally.
  # =============================================================================

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: skillforge-langfuse-web
    ports:
      - "3000:3000"
    environment:
      # Database connections
      DATABASE_URL: postgresql://langfuse:langfuse-dev@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-dev
      REDIS_CONNECTION_STRING: redis://:redis-dev@langfuse-redis:6379

      # S3/MinIO for blob storage (local - FREE)
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio-dev-access
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio-dev-secret-key
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      # Security (development values - change in production!)
      NEXTAUTH_SECRET: skillforge-dev-nextauth-secret-32chars
      SALT: skillforge-dev-salt-minimum-32-chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000

      # Optional: Auto-create project on first run
      LANGFUSE_INIT_ORG_ID: skillforge-org
      LANGFUSE_INIT_ORG_NAME: SkillForge
      LANGFUSE_INIT_PROJECT_ID: skillforge
      LANGFUSE_INIT_PROJECT_NAME: SkillForge Backend
      LANGFUSE_INIT_USER_EMAIL: dev@skillforge.local
      LANGFUSE_INIT_USER_PASSWORD: skillforge-dev-password
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default

  langfuse-worker:
    image: langfuse/langfuse:3
    container_name: skillforge-langfuse-worker
    command: ["node", "packages/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse-dev@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-dev
      REDIS_CONNECTION_STRING: redis://:redis-dev@langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio-dev-access
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio-dev-secret-key
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      NEXTAUTH_SECRET: skillforge-dev-nextauth-secret-32chars
      SALT: skillforge-dev-salt-minimum-32-chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      langfuse-web:
        condition: service_healthy
    networks:
      - default

  langfuse-db:
    image: postgres:16-alpine
    container_name: skillforge-langfuse-db
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse-dev
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: skillforge-langfuse-clickhouse
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse-dev
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-redis:
    image: redis:7-alpine
    container_name: skillforge-langfuse-redis
    command: redis-server --requirepass redis-dev
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-minio:
    image: minio/minio:latest
    container_name: skillforge-langfuse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minio-dev-access
      MINIO_ROOT_PASSWORD: minio-dev-secret-key
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-minio-setup:
    image: minio/mc:latest
    container_name: skillforge-langfuse-minio-setup
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://langfuse-minio:9000 minio-dev-access minio-dev-secret-key;
      mc mb minio/langfuse --ignore-existing;
      exit 0;
      "
    networks:
      - default

volumes:
  postgres-dev-data:
  redis-dev-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:
  langfuse-minio-data:
