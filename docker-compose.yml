name: skillforge

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: skillforge-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5437:5432"  # Using 5437 to avoid conflicts with reporter-accuracy (5433, 5436)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: skillforge-redis-dev
    ports:
      - "6380:6379"  # Using 6380 to avoid conflicts
    environment:
      # Redis Stack configuration via environment variables
      # This preserves module loading while adding our custom settings
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD}
        --timeout 0
        --tcp-keepalive 60
        --maxclients 1000
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-dev-data:/data
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: skillforge-backend-dev
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_V1_PREFIX: /api/v1
      HOST: 0.0.0.0
      PORT: 8500
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5175"]'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Langfuse: Override localhost with Docker network hostname
      LANGFUSE_HOST: http://langfuse-web:3000
      # Note: DATABASE_URL and LANGFUSE_HOST are overridden above for container-internal connections
      # All other variables (API keys, LLM_MODEL, JINA_API_KEY, etc.) are loaded from ./backend/.env via env_file
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Mount code for hot reload (development)
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -U dev -d postgres; do sleep 2; done &&
        echo 'Running migrations...' &&
        /app/.venv/bin/alembic upgrade head &&
        echo 'Starting backend...' &&
        /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8500 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: skillforge-frontend-dev
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:8500
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =============================================================================
  # LANGFUSE v3 OBSERVABILITY STACK (Self-Hosted - FREE)
  # =============================================================================
  # Replaces LangSmith cloud with local observability.
  # All services are open source and run locally.
  # =============================================================================

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: skillforge-langfuse-web
    ports:
      - "3000:3000"
    environment:
      # Database connections
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # Redis configuration
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}

      # S3/MinIO for blob storage (local - FREE)
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"

      # Security (development values - change in production!)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${NEXTAUTH_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL: http://localhost:3000

      # Optional: Auto-create project on first run
      LANGFUSE_INIT_ORG_ID: skillforge-org
      LANGFUSE_INIT_ORG_NAME: SkillForge
      LANGFUSE_INIT_PROJECT_ID: skillforge
      LANGFUSE_INIT_PROJECT_NAME: SkillForge Backend
      LANGFUSE_INIT_USER_EMAIL: dev@skillforge.local
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --timeout=5 http://langfuse-web:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - default

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: skillforge-langfuse-worker
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB}
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@langfuse-clickhouse:9000/langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # Redis configuration (worker uses individual vars, not connection string)
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      # S3/MinIO configuration
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # Security
      SALT: ${NEXTAUTH_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
    depends_on:
      langfuse-web:
        condition: service_healthy
    networks:
      - default

  langfuse-db:
    image: postgres:16-alpine
    container_name: skillforge-langfuse-db
    environment:
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB}
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: skillforge-langfuse-clickhouse
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default

  langfuse-redis:
    image: redis:7-alpine
    container_name: skillforge-langfuse-redis
    command: redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-minio:
    image: minio/minio:latest
    container_name: skillforge-langfuse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  langfuse-minio-setup:
    image: minio/mc:latest
    container_name: skillforge-langfuse-minio-setup
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://langfuse-minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb minio/langfuse --ignore-existing;
      exit 0;
      "
    networks:
      - default

volumes:
  postgres-dev-data:
  redis-dev-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:
  langfuse-minio-data:
